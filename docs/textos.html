<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Textos para TikTok</title>

<style>
/* Una columna para el pulgar: cada texto es una ficha con su botón de copiar; arriba, pendientes y pegados */
:root {
  --bg: #FAF8F5; --card: #FFFFFF; --ink: #1A1510; --muted: #6E645C; --line: #E6DED6;
  --vino: #6B1A2B; --vino-soft: #F3E6E8; --ok: #2F6B3F; --ok-soft: #E4EFE6;
  --display: "Playfair Display", Georgia, serif; --body: "DM Sans", system-ui, -apple-system, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #15110E; --card: #1F1915; --ink: #F1ECE6; --muted: #A89C92; --line: #342B25;
  --vino: #D4788A; --vino-soft: #3A2026; --ok: #8CC79B; --ok-soft: #1E3324; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #15110E; --card: #1F1915; --ink: #F1ECE6; --muted: #A89C92; --line: #342B25;
  --vino: #D4788A; --vino-soft: #3A2026; --ok: #8CC79B; --ok-soft: #1E3324; color-scheme: dark }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 16px; line-height: 1.5; }
.wrap { max-width: 640px; margin: 0 auto; padding-inline: 16px; padding-block: 20px 48px; display: grid; gap: 16px; }
header { display: grid; gap: 6px; }
h1 { font-family: var(--display); font-weight: 600; font-size: 1.75rem; line-height: 1.15; margin: 0; text-wrap: balance; }
.sub { color: var(--muted); margin: 0; font-size: .95rem; }
.tabs { display: flex; gap: 8px; position: sticky; top: env(safe-area-inset-top, 0px); background: var(--bg); padding-block: 8px; z-index: 2; }
.tab { flex: 1; border: 1px solid var(--line); background: var(--card); color: var(--ink); border-radius: 999px;
  padding: 10px 12px; font: 600 .95rem var(--body); cursor: pointer; font-variant-numeric: tabular-nums; }
.tab[aria-pressed="true"] { background: var(--vino); border-color: var(--vino); color: var(--bg); }
.lista { display: grid; gap: 12px; }
.ficha { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px; display: grid; gap: 10px; min-width: 0; }
.ficha.pegado { opacity: .62; }
.cab { display: flex; gap: 8px; align-items: baseline; justify-content: space-between; flex-wrap: wrap; }
.serie { font-size: .72rem; letter-spacing: .06em; text-transform: uppercase; color: var(--vino); font-weight: 700; }
.fecha { font-size: .78rem; color: var(--ok); font-weight: 600; font-variant-numeric: tabular-nums; }
.fecha.llega { color: var(--muted); font-weight: 400; }
.tit { font-weight: 700; font-size: 1.05rem; margin: 0; text-wrap: balance; }
.texto { white-space: pre-wrap; overflow-wrap: anywhere; margin: 0; font-size: .92rem; color: var(--ink);
  max-height: 7.6em; overflow: hidden; position: relative; }
.texto.abierto { max-height: none; }
.acciones { display: flex; gap: 8px; flex-wrap: wrap; }
.btn { border: 0; border-radius: 10px; padding: 12px 16px; font: 700 1rem var(--body); cursor: pointer; }
.copiar { background: var(--vino); color: var(--bg); flex: 1 1 140px; }
.copiar.listo { background: var(--ok); }
.sec { background: transparent; color: var(--ink); border: 1px solid var(--line); flex: 0 1 auto; }
.marcar[aria-pressed="true"] { background: var(--ok-soft); color: var(--ok); border-color: transparent; }
.btn:focus-visible, .tab:focus-visible { outline: 3px solid var(--vino); outline-offset: 2px; }
.vacio { text-align: center; color: var(--muted); padding-block: 32px; }
@media (prefers-reduced-motion: no-preference) { .btn, .tab { transition: background .15s, color .15s; } }
</style>

  <header>
    <h1>Textos para TikTok</h1>

  </div>

<script>
const DATOS = [{"id": "peli-24-betesda", "titulo": "Llevaba 38 años esperando lo que no lo iba a sanar", "serie": "Películas 24", "ts": "2026-10-10 18:46", "llega": "", "texto": "¿Cuánto tiempo llevás esperando al lado del mismo estanque?\n\nEn Betesda había un estanque. Se decía que cuando el agua se agitaba, el primero que entraba quedaba sano. Este hombre llevaba treinta y ocho años ahí (Juan 5:5). Treinta y ocho años mirando el agua, esperando que alguien lo llevara, viendo cómo otros llegaban antes.\n\nJesús le pregunta si quiere ser sano. Y él contesta con lo que tiene ensayado: no tengo a nadie que me lleve al agua. Le explica el sistema, quién lo ayuda, quién no, quién se le adelanta.\n\nPero Jesús no le pregunta por el estanque. Le pregunta por él. Ese estanque no tenía nada para darle. Y no lo lleva al agua: Levántate, toma tu lecho, y anda (Juan 5:8).\n\nMuchos vivimos así. Esperando el momento, el método, la persona, la próxima vez que se mueva el agua. Creyendo que si nos esforzamos lo suficiente vamos a llegar primero. Y Él está delante nuestro diciendo: no necesitás esto, me necesitás a mí.\n\nY no te devuelve a la vida de antes un poco mejorada. Esa vida terminó. De modo que si alguno está en Cristo, nueva criatura es: las cosas viejas son pasadas; he aquí todas son hechas nuevas (2 Corintios 5:17).\n\nMás enseñanzas en YouTube (@adrianencamino) y en elgransueno.org. Link en el perfil.\n\n#ElGranSueñoDeDios #ElGranSueño #CristoEnNosotros #CristoMiVida #LosElegidos #Betesda #VidaNueva"}, {"id": "ten-misericordia-r3", "titulo": "Ten misericordia r3", "serie": "Ten misericordia", "ts": "2026-10-10 15:17", "llega": "", "texto": "Hay cosas en mí que no soy yo.\n\nPablo lo dijo antes que nadie: Y si hago lo que no quiero, ya no lo obro yo, sino el pecado que mora en mí (Romanos 7:20). La guerra de adentro es real. Pero lo que mora en mí no es quien soy. En Cristo ya no estoy en la carne, sino en el Espíritu (Romanos 8:9).\n\nPor eso no me asusta que Dios me siga mostrando lo que todavía no veo. No lo hace para condenarme, sino para que Cristo tome forma en mí (Gálatas 4:19).\n\nEustace no podía sacarse solo la piel de dragón. Aslan se la sacó.\n\nEsto es parte de una historia: un día anoté en un papel una sola frase, Jesús, ten misericordia de mí. La historia completa, en el video largo.\n\nMás enseñanzas en YouTube (@adrianencamino) y en elgransueno.org. Link en el perfil.\n\n#ElGranSueñoDeDios #ElGranSueño #CristoEnNosotros #CristoMiVida #NuevaVida #Romanos7"}, {"id": "peli-09-maria", "titulo": "Él no te llama por tu herida", "serie": "Películas 09", "ts": "2026-10-10 15:13", "llega": "", "texto": "¿Con qué nombre te llamás vos cuando nadie te ve?\n\nDe niña, su papá le enseñó qué hacer cuando tuviera miedo: decir las palabras de Dios. Así dice el Señor que te creó, y el que te formó: no temas.\n\nAños después en el bar la llamaban Lilith. Era el nombre que le había quedado de todo lo que le pasó: el dolor, el miedo, los años de oscuridad. Las palabras de su papá habían quedado enterradas, y ella había terminado creyendo que era eso.\n\nY una noche, escondida en un rincón, alguien la llama por su nombre verdadero. María.\n\n¿Cómo sabes mi nombre?, pregunta. Y Jesús le responde con las mismas palabras que ella aprendió de niña: No temas, porque yo te redimí; te puse nombre, mío eres tú (Isaías 43:1). Lo que Dios dijo sobre ella seguía en pie, aunque ella lo hubiera olvidado.\n\nÉl no te llama por lo que te hicieron ni por lo que hiciste. No te llama por tu herida. Te llama por el nombre que Él te dio. Y ese nombre no lo ganaste: te lo dio cuando te redimió.\n\nDe modo que si alguno está en Cristo, nueva criatura es: las cosas viejas pasaron; he aquí todas son hechas nuevas (2 Corintios 5:17). La vida nueva no es una Lilith mejorada. Es María. Es hija, en Cristo.\n\nMás enseñanzas en YouTube (@adrianencamino) y en elgransueno.org. Link en el perfil.\n\n#ElGranSueñoDeDios #ElGranSueño #CristoEnNosotros #CristoMiVida #LosElegidos #MaríaMagdalena #Identidad"}, {"id": "r20-la-unica-vida-que-dios-llama-vida", "titulo": "La unica vida que dios llama vida", "serie": "Terraza 20", "ts": "2026-10-09 22:14", "llega": "", "texto": "La única vida que Dios llama vida es Cristo en nosotros. La única luz que llama luz. La única sal.\n\nY esta vida crece día a día. Todas las cosas obran para bien. Podemos retrasar el proceso, claro, ahí tenemos al pueblo de Israel.\n\nPor eso descansemos: nuestro valor y nuestra realidad es la de Cristo en nosotros, esa vida eterna que permanece, no las cosas exteriores que estamos viendo.\n\nMás en elgransueno.org\n\n#elgransueno #Cristo #vidanueva #descanso #identidadenCristo #vidaeterna"}, {"id": "r05-pensas-que-estas-creciendo", "titulo": "Pensas que estas creciendo", "serie": "Terraza 05", "ts": "2026-10-09 22:08", "llega": "", "texto": "Esta frase me la dijo mi hermano en una charla cualquiera, y terminó siendo el comienzo de todo el video.\n\nCasi siempre medimos el crecimiento como en la pared de cuando éramos chicos: una marca un poco más arriba, un poco más de lo mismo. Más conocimiento, más disciplina, una mejor versión de uno.\nPero el crecer del que habla el Evangelio no es que vos crezcas. Es que la vida de Cristo, la única vida que hay en vos, ocupe todo el lugar.\n\nA veces eso se siente como perderte. Es justo ahí donde aparecés de verdad.\n\nEl video completo, Pensás que estás creciendo. Y quizás no, está en YouTube (@adrianencamino).\nEn elgransueno.org conectamos a los que están viviendo el gran sueño de Dios. Link en la bio.\n\n#ElGranSueñoDeDios #ElGranSueño #CristoEnNosotros #CristoMiVida #CristoNuestraVida #2Corintios411"}, {"id": "peli-22-mateo", "titulo": "Llamó al que nadie quería", "serie": "Películas 22", "ts": "2026-10-09 21:29", "llega": "", "texto": "¿Hay un lugar donde sentís que no sos bienvenido?\n\nMateo cobraba impuestos para Roma. Para su pueblo era un traidor. Rico, protegido y despreciado por todos. Nadie lo quería cerca.\n\nY Jesús se para frente a su mesa y le dice una sola palabra. Y pasando Jesús de allí, vio a un hombre que estaba sentado al banco de los públicos tributos, el cual se llamaba Mateo; y dícele: Sígueme. Y se levantó, y le siguió (Mateo 9:9).\n\nNo le pidió que cambiara primero. No le puso condiciones. Lo llamó así como estaba. Mas Dios encarece su caridad para con nosotros, porque siendo aún pecadores, Cristo murió por nosotros (Romanos 5:8).\n\nY cuando Mateo dice no soy bienvenido a las cenas, Jesús le responde: esta noche, tú invitas. Así que ya no sois extranjeros ni advenedizos, sino juntamente ciudadanos con los santos, y domésticos de Dios (Efesios 2:19).\n\nEn Él ya no sos el que nadie quiere. Sos de la casa.\n\nMás enseñanzas en YouTube (@adrianencamino) y en elgransueno.org. Link en el perfil.\n\n#ElGranSueñoDeDios #ElGranSueño #CristoEnNosotros #CristoMiVida #LosElegidos #Gracia #Sígueme"}, {"id": "peli-23-mujer", "titulo": "Doce años sin que nadie la tocara", "serie": "Películas 23", "ts": "2026-10-09 21:23", "llega": "", "texto": "¿Cuánto tiempo llevás cargando algo que nadie pudo sanar?\n\nDoce años. Doce años sangrando, gastando todo en médicos y empeorando. Para la ley estaba impura: nadie podía tocarla, y todo lo que ella tocaba quedaba sucio. Doce años sin un abrazo.\n\nY se mete entre la multitud con una sola idea: si solo toco la orilla de su manto. Y la toca. Y Jesús se detiene. ¿Quién me tocó?\n\nElla tiembla. Cree que la van a echar otra vez. Yo ya no soy hija de nadie, dice. Y Jesús la mira y le dice lo que nadie le había dicho en años. Y él le dijo: Hija, tu fe te ha salvado: ve en paz (Lucas 8:48).\n\nNo fue un pedazo de tela. Fue Él. Y no solo la sanó: le devolvió el nombre. Mirad cuál amor nos ha dado el Padre, que seamos llamados hijos de Dios (1 Juan 3:1).\n\nLo que te hizo sentir lejos no tiene la última palabra. Él te llama hijo. Te llama hija.\n\nMás enseñanzas en YouTube (@adrianencamino) y en elgransueno.org. Link en el perfil.\n\n#ElGranSueñoDeDios #ElGranSueño #CristoEnNosotros #CristoMiVida #LosElegidos #HijosDeDios #Gracia"}, {"id": "peli-16-thor", "titulo": "¿Qué te hace digno?", "serie": "Películas 16", "ts": "2026-10-09 21:19", "llega": "", "texto": "¿Sentís que fallaste en lo que se suponía que tenías que ser?\n\nThor vuelve a ver a su madre y le confiesa lo que lo carcome: llegó tarde, se quedó parado, se siente un fracaso. Y ella no lo niega. Le dice algo más fuerte: todos fracasan en lo que se supone que deben ser.\n\nAhí está la trampa. Vivimos midiendo nuestro valor por lo que logramos o por lo que perdimos. Y como siempre fallamos en algo, siempre nos sentimos indignos.\n\nPero mirá lo que pasa al final. Thor no hizo nada para merecerlo. Extiende la mano y el martillo viene igual. Todavía soy digno.\n\nEn Cristo tu dignidad no depende de tu rendimiento. No te la ganás en tu mejor día ni la perdés en el peor. Dando gracias al Padre que nos hizo aptos para participar de la suerte de los santos en luz (Colosenses 1:12). Para alabanza de la gloria de su gracia, con la cual nos hizo aceptos en el Amado (Efesios 1:6).\n\nNo tenés que salir a ser alguien. Ya sos hijo. Andá a vivir desde ahí.\n\nMás enseñanzas en YouTube (@adrianencamino) y en elgransueno.org. Link en el perfil.\n\n#ElGranSueñoDeDios #ElGranSueño #CristoEnNosotros #CristoMiVida #Thor #Identidad #Gracia"}, {"id": "peli-13-simon", "titulo": "¿Hiciste todo y no sacaste nada?", "serie": "Películas 13", "ts": "2026-10-09 21:19", "llega": "", "texto": "¿Cuántas noches llevás tirando la red con tus propias fuerzas?\n\nSimón había trabajado toda la noche y no había sacado nada. Era pescador, sabía lo que hacía, y aun así: nada. Jesús le dice que tire la red otra vez. Y él responde: Maestro, habiendo trabajado toda la noche, nada hemos tomado; mas en tu palabra echaré la red (Lucas 5:5).\n\nLa red se llenó tanto que no daban abasto. Lo que no logró en una noche entera de esfuerzo, Jesús lo hizo en un instante.\n\nY lo primero que hace Simón no es festejar. Cae de rodillas: Apártate de mí, Señor, porque soy hombre pecador (Lucas 5:8). Pero Jesús no se va. Le dice: no tengas miedo. Levanta tu cabeza. Sígueme.\n\nNo le pidió que se arreglara primero. No le pidió que fuera mejor pescador. Lo llamó así como estaba. Y le dijo lo que nos dice a nosotros: yo me encargaré del resto.\n\nTus redes siempre se van a romper. La vida nueva no es esforzarte más para que no se rompan: es vivir desde Él. Lo que Él da, Él lo sostiene. Porque sin mí nada podéis hacer (Juan 15:5).\n\nMás enseñanzas en YouTube (@adrianencamino) y en elgransueno.org. Link en el perfil.\n\n#ElGranSueñoDeDios #ElGranSueño #CristoEnNosotros #CristoMiVida #LosElegidos #Descanso #NuevaVida"}, {"id": "peli-12-leproso", "titulo": "Lo que te hace intocable no lo detiene", "serie": "Películas 12", "ts": "2026-10-09 21:19", "llega": "", "texto": "¿Hay algo en vos que creés que hace que Dios se aleje?\n\nUn leproso no podía acercarse a nadie. Tenía que gritar impuro para que la gente se apartara. Nadie lo tocaba, y la ley decía que el que tocara a un leproso quedaba impuro.\n\nPor eso los discípulos gritan: es un leproso, atrás. Y él, en el suelo, solo pide una cosa: por favor, no te alejes de mí.\n\nJesús no se aleja. Y Jesús, teniendo misericordia de él, extendió su mano, y le tocó, y le dice: Quiero, sé limpio (Marcos 1:41).\n\nLo tocó antes de que estuviera limpio. Y no fue la lepra la que pasó a Jesús: fue la vida de Jesús la que pasó al leproso. Su santidad es más fuerte que tu impureza. Lo que te hacía intocable no lo detiene.\n\nPor eso no tenés que limpiarte primero para acercarte. Él ya se acercó. Y lo que hace no es arreglar al viejo hombre: es darte su vida. De modo que si alguno está en Cristo, nueva criatura es (2 Corintios 5:17).\n\nMás enseñanzas en YouTube (@adrianencamino) y en elgransueno.org. Link en el perfil.\n\n#ElGranSueñoDeDios #ElGranSueño #CristoEnNosotros #CristoMiVida #LosElegidos #Gracia #NuevaVida"}, {"id": "peli-11-santiago", "titulo": "¿Por qué Dios no te sanó todavía?", "serie": "Películas 11", "ts": "2026-10-09 21:19", "llega": "", "texto": "¿Y si tu debilidad no es un castigo, sino una confianza?\n\nSantiago caminaba con dificultad. Jesús lo estaba enviando a sanar enfermos, y él no entendía: ¿cómo voy a sanar a otros con esta condición que vos no curaste?\n\nJesús le pregunta si quiere ser sanado. Sí. ¿Y por qué no lo hiciste? Porque confío en ti.\n\nNo lo sanó en ese momento, y no fue por falta de amor. Le confió algo que pocos pueden llevar: proclamar el nombre de Dios a pesar de esto, ser paciente en el sufrimiento sabiendo que la eternidad no tiene sufrimiento. ¿A cuántas personas crees que el Padre y yo les confiamos esto? No a muchas.\n\nPablo pidió tres veces que le quitaran su aguijón, y la respuesta fue: Bástate mi gracia; porque mi potencia en la flaqueza se perfecciona (2 Corintios 12:9).\n\nDios nunca te pidió que fueras fuerte. La fuerza real no sale de lo que vos podés. Es la vida de Cristo en vos, que se ve justamente donde vos no podés. Por eso Pablo termina diciendo: de buena gana me gloriaré más bien en mis flaquezas, porque habite en mí la potencia de Cristo.\n\nMás enseñanzas en YouTube (@adrianencamino) y en elgransueno.org. Link en el perfil.\n\n#ElGranSueñoDeDios #ElGranSueño #CristoEnNosotros #CristoMiVida #LosElegidos #Fragilidad #Gracia"}, {"id": "peli-08-narnia", "titulo": "¿Quién pagó lo que hiciste?", "serie": "Películas 08", "ts": "2026-10-09 21:19", "llega": "", "texto": "En Narnia, Edmund traicionó a sus hermanos. Y la ley más antigua de ese mundo, la gran magia, decía que la vida de todo traidor le pertenece a la Bruja.\n\nAslan no discutió la ley. Se entregó en su lugar. Esa noche lo ataron a la mesa de piedra y la Bruja se burló: ¿en serio creíste que al sacrificarte lograrías salvar al humano traidor? Estás dándome tu vida sin salvar a nadie.\n\nAl amanecer la mesa estaba partida en dos y Aslan estaba vivo. Había una magia más profunda: cuando una víctima voluntaria que no cometió traición muere en lugar de un traidor, la mesa de piedra se rompe y la muerte misma da marcha atrás.\n\nLa ley estaba escrita en piedra y era justa: la paga del pecado es muerte. No hacía falta borrar la ley. Hacía falta que un inocente cargara con ella en tu lugar. Al que no conoció pecado, hizo pecado por nosotros, para que nosotros fuésemos hechos justicia de Dios en él (2 Corintios 5:21).\n\nPor eso la cédula que nos era contraria fue quitada de en medio y clavada en la cruz (Colosenses 2:14). Y el mismo versículo que dice que la paga del pecado es muerte termina así: mas la dádiva de Dios es vida eterna en Cristo Jesús Señor nuestro (Romanos 6:23).\n\nNo te define lo que hiciste. Te define lo que Él hizo. Ya no sos el traidor: sos justicia de Dios en Él.\n\nMás enseñanzas en YouTube (@adrianencamino) y en elgransueno.org. Link en el perfil.\n\n#ElGranSueñoDeDios #ElGranSueño #CristoEnNosotros #CristoMiVida #Narnia #Aslan #Gracia"}, {"id": "v09-el-es-mi-vida", "titulo": "El es mi vida", "serie": "Vivís en automático 09", "ts": "2026-10-09 20:32", "llega": "", "texto": "El desafío es uno: vivir en coherencia con lo que Dios ya dijo, con lo que ya hizo y con Cristo en vos.\n\nÉl es la vida nueva. Él es mi vida. Por eso necesito conocerlo: para menguar y para ser transformado.\n\nCuando Cristo, vuestra vida, se manifestare, entonces vosotros también seréis manifestados con él en gloria (Colosenses 3:4).\n\nEl video completo, Vivís en automático y lo llamás vida espiritual, está en YouTube (@adrianencamino).\nEn elgransueno.org conectamos a los que están viviendo el gran sueño de Dios. Link en la bio.\n\n#ElGranSueñoDeDios #ElGranSueño #CristoEnNosotros #CristoMiVida #NuevaVida #Colosenses34"}, {"id": "v10-si-queremos-intervenir-arruinamos", "titulo": "Si queremos intervenir arruinamos", "serie": "Vivís en automático 10", "ts": "2026-10-09 20:31", "llega": "", "texto": "Hay algo que no nos toca: intervenir. Cuando queremos intervenir, lo arruinamos, porque la obra es ajena a nosotros.\n\nNo sucede en la mente. Sucede en la realidad de Cristo como vida, formándose y creciendo en nosotros. Lo nuestro es responder y ponernos de acuerdo, para que Cristo sea expresado como vida y como luz real.\n\nEl video completo, Vivís en automático y lo llamás vida espiritual, está en YouTube (@adrianencamino).\nEn elgransueno.org conectamos a los que están viviendo el gran sueño de Dios. Link en la bio.\n\n#ElGranSueñoDeDios #ElGranSueño #CristoEnNosotros #CristoMiVida #Reposo #Crecer"}, {"id": "v08-el-gran-exito-es-perseverar", "titulo": "El gran exito es perseverar", "serie": "Vivís en automático 08", "ts": "2026-10-09 20:30", "llega": "", "texto": "Caminar en coherencia con lo que Dios ya hizo tiene un costo: una parte tuya no lo va a ver con lógica, ni con sentido, ni con razón.\n\nVa a haber lucha entre lo que ves y lo que creés. Y el gran éxito no es entenderlo todo. Es perseverar, permanecer en Cristo, que es tu vida.\n\nEl video completo, Vivís en automático y lo llamás vida espiritual, está en YouTube (@adrianencamino).\nEn elgransueno.org conectamos a los que están viviendo el gran sueño de Dios. Link en la bio.\n\n#ElGranSueñoDeDios #ElGranSueño #CristoEnNosotros #CristoMiVida #Perseverar #Fe"}, {"id": "v07-ahora-vuelven-a-las-mentiras", "titulo": "Ahora vuelven a las mentiras", "serie": "Vivís en automático 07", "ts": "2026-10-09 20:29", "llega": "", "texto": "Pablo veía algo majestuoso, incomparable. Por eso confrontaba a los que habían empezado en libertad y ahora volvían a las mentiras.\n\nLa espiritualidad no es hacer más. Es responder a lo que Dios ya dijo y ya hizo, y caminar en coherencia con lo que está hecho: Cristo en vos.\n\nEl video completo, Vivís en automático y lo llamás vida espiritual, está en YouTube (@adrianencamino).\nEn elgransueno.org conectamos a los que están viviendo el gran sueño de Dios. Link en la bio.\n\n#ElGranSueñoDeDios #ElGranSueño #CristoEnNosotros #CristoMiVida #Libertad #Gálatas33"}, {"id": "v05-dios-nos-da-en-cristo-su-vida", "titulo": "Dios nos da en cristo su vida", "serie": "Vivís en automático 05", "ts": "2026-10-09 20:27", "llega": "", "texto": "No entramos a la vida espiritual con búsquedas, esfuerzo o disciplina. La verdadera vida espiritual es Él.\n\nY ese es el regalo: Dios nos da en Cristo su vida, nos une a Él y nos elige como casa. No hay que alcanzarlo. Hay que recibirlo y vivir desde ahí.\n\nEl video completo, Vivís en automático y lo llamás vida espiritual, está en YouTube (@adrianencamino).\nEn elgransueno.org conectamos a los que están viviendo el gran sueño de Dios. Link en la bio.\n\n#ElGranSueñoDeDios #ElGranSueño #CristoEnNosotros #CristoMiVida #Gracia #Regalo"}, {"id": "v06-han-sido-trasladados", "titulo": "Han sido trasladados", "serie": "Vivís en automático 06", "ts": "2026-10-09 20:24", "llega": "", "texto": "Pasar de oscuridad a luz, de muerte a vida, no es una idea. Es un hecho.\n\nPablo empezaba sus cartas así: ustedes ya fueron trasladados. Lo veía como algo concreto, terminado, y su deseo era que los hijos lo vieran y lo vivieran.\n\nNos libró de la potestad de las tinieblas y nos trasladó al reino de su amado Hijo (Colosenses 1:13).\n\nEl video completo, Vivís en automático y lo llamás vida espiritual, está en YouTube (@adrianencamino).\nEn elgransueno.org conectamos a los que están viviendo el gran sueño de Dios. Link en la bio.\n\n#ElGranSueñoDeDios #ElGranSueño #CristoEnNosotros #CristoMiVida #DeOscuridadALuz #Colosenses113"}, {"id": "v04-la-verdadera-vida-espiritual-es-dios", "titulo": "La verdadera vida espiritual es dios", "serie": "Vivís en automático 04", "ts": "2026-10-09 20:23", "llega": "", "texto": "¿Qué es la vida espiritual? Si es verdadera, tiene que ver con la verdad. Si es espiritual, tiene que ver con el espíritu.\n\nDios es Espíritu y Él es la verdad. Entonces la verdadera vida espiritual no es una técnica ni una disciplina: es Dios mismo, y en Cristo Él es nuestra vida.\n\nEl video completo, Vivís en automático y lo llamás vida espiritual, está en YouTube (@adrianencamino).\nEn elgransueno.org conectamos a los que están viviendo el gran sueño de Dios. Link en la bio.\n\n#ElGranSueñoDeDios #ElGranSueño #CristoEnNosotros #CristoMiVida #VidaEspiritual #Juan424"}, {"id": "v03-es-un-trabajo-de-derrumbe", "titulo": "Es un trabajo de derrumbe", "serie": "Vivís en automático 03", "ts": "2026-10-09 20:21", "llega": "", "texto": "La verdadera espiritualidad no es un adorno. Aunque la pintemos de rosa, es un derrumbe: cae el sostén que no sostenía nada, cae lo que no es eterno, cae lo que no produce vida.\n\nNo es un castigo. Es Dios soltando de nuestras manos las fuentes rotas para que quede la única que da vida: Cristo.\n\nEl video completo, Vivís en automático y lo llamás vida espiritual, está en YouTube (@adrianencamino).\nEn elgransueno.org conectamos a los que están viviendo el gran sueño de Dios. Link en la bio.\n\n#ElGranSueñoDeDios #ElGranSueño #CristoEnNosotros #CristoMiVida #VidaEspiritual #Derrumbe"}, {"id": "v02-nunca-me-acostumbre-a-decir-soy-asi", "titulo": "Nunca me acostumbre a decir soy asi", "serie": "Vivís en automático 02", "ts": "2026-10-09 20:20", "llega": "", "texto": "A los 15 o 16 años me di cuenta de que algo no estaba bien. Esto no es normal, esto no soy yo.\n\nTodavía no entendía lo que era la nueva vida, pero sabía que eso que había en mí no venía de Dios. Por eso nunca acepté el soy así, punto.\n\nFue un proceso largo. Y lo que encontré no fue una versión mejorada de mí, sino a Cristo como mi vida.\n\nEl video completo, Vivís en automático y lo llamás vida espiritual, está en YouTube (@adrianencamino).\nEn elgransueno.org conectamos a los que están viviendo el gran sueño de Dios. Link en la bio.\n\n#ElGranSueñoDeDios #ElGranSueño #CristoEnNosotros #CristoMiVida #NuevaVida #Identidad"}, {"id": "v01-busca-dejar-de-estar-en-automatico", "titulo": "Busca dejar de estar en automatico", "serie": "Vivís en automático 01", "ts": "2026-10-09 20:18", "llega": "", "texto": "Caminando por Tirana me crucé con un ingeniero turco de 42 años. Hablamos de creencias y me contó lo que busca: conectar con su esencia, dejar de vivir en automático, sentirse lleno.\n\nEs lo que busca todo el mundo. Y llegar a reconocerlo ya es hermoso, porque ahí la búsqueda se encuentra con Alguien: Cristo, que no viene a llenar un hueco sino a ser la vida.\n\nEl video completo, Vivís en automático y lo llamás vida espiritual, está en YouTube (@adrianencamino).\nEn elgransueno.org conectamos a los que están viviendo el gran sueño de Dios. Link en la bio.\n\n#ElGranSueñoDeDios #ElGranSueño #CristoEnNosotros #CristoMiVida #VidaEspiritual #Esencia"}, {"id": "r08-nuestra-gran-guerra", "titulo": "Nuestra gran guerra", "serie": "Terraza 08", "ts": "2026-10-09 18:18", "llega": "", "texto": "Nuestra gran guerra está en nuestra manera de querer entender las cosas.\n\nEn no atrevernos a rendirnos del todo. En querer controlar. En seguir sobreviviendo.\n\nPero la única vida que Dios llama vida es Cristo en nosotros.\n\nMás en elgransueno.org\n\n#elgransueno #Cristo #vidanueva #descanso #identidadenCristo #rendicion"}, {"id": "r11-yo-fui-ese", "titulo": "Yo fui ese", "serie": "Terraza 11", "ts": "2026-10-09 10:50", "llega": "", "texto": "Se puede decir la verdad y aun así causar dolor. Ver mucho, hablar claro, corregir, pero desde la justicia propia y el control.\n\nLa verdad sin la vida de Cristo hiere. Lo que cambia todo no es tener razón, es que Él se exprese a través nuestro, en total libertad.\n\nY ahí está el equilibrio: la verdad dicha desde Cristo, que es nuestra vida.\n\nEl video completo, Pensás que estás creciendo. Y quizás no, está en YouTube (@adrianencamino).\nEn elgransueno.org conectamos a los que están viviendo el gran sueño de Dios. Link en la bio.\n\n#ElGranSueñoDeDios #ElGranSueño #CristoEnNosotros #CristoMiVida #Gracia #Efesios415"}, {"id": "r34-amar-tambien-es-morir", "titulo": "Amar tambien es morir", "serie": "Terraza 34", "ts": "2026-10-09 10:46", "llega": "", "texto": "El amar, por cierto, es un proceso de muerte.\n\nEs un proceso de muerte porque la carne no quiere saber de amar. La carne no sabe amar.\n\nPero somos llamados a tomar nuestra cruz y permitir que nuestra alma responda a la realidad de Cristo. Que nuestra alma vaya a toda la obediencia.\n\nPara que nuestra característica, cómo Dios nos hizo, responda a Dios. Para que seamos verdadera expresión de lo único que Dios llama vida, y a lo que hemos sido trasladados.\n\nMás en elgransueno.org\n\n#elgransueno #Cristo #vidanueva #descanso #identidadenCristo"}, {"id": "r33-que-significa-amar", "titulo": "Que significa amar", "serie": "Terraza 33", "ts": "2026-10-09 10:46", "llega": "", "texto": "¿Qué significa amar en este proceso?\n\nEl amor no es algo que yo pueda hacer a mi manera. El amor es Dios. Él es el que puede ser expresado.\n\nNosotros llamamos amor a todo: al egoísmo, a querer a los que me hacen bien. Todo eso es la carne tratando de responder.\n\nPor eso lo verdadero es amá a tus enemigos, bendecí a los que te persiguen. ¿Cómo es posible? Mediante la expresión del amor, Cristo en vos.\n\nEntonces amá. Que Cristo sea tu vida, que Él sea expresado. Y si esto sucede, hacé lo que quieras. Hacé aquello que te apasiona, porque vas a vivir desde el amor.\n\nMás en elgransueno.org\n\n#elgransueno #Cristo #vidanueva #descanso #identidadenCristo"}, {"id": "r32-ama-y-haz-lo-que-quieras", "titulo": "Ama y haz lo que quieras", "serie": "Terraza 32", "ts": "2026-10-09 10:46", "llega": "", "texto": "Escuché una frase de San Agustín: ama y haz lo que quieras.\n\nEse hacer lo que quieras tiene que ver con la libertad. Con tu pasión. Con estar conectado. Con lo que Pablo dice: sean libres, pero no usen esa libertad para lo que no es su identidad, no usen su libertad para la carne.\n\nY hay una realidad muy fuerte. No sabemos vivir en libertad. Y estamos aprendiendo.\n\nVivir en libertad es vivir desde la realidad de Cristo en vos. Es vivir desde esa nueva vida. Y esa nueva vida hay que conocerla.\n\nMás en elgransueno.org\n\n#elgransueno #Cristo #vidanueva #descanso #identidadenCristo"}, {"id": "r31-ten-misericordia-de-mi", "titulo": "Ten misericordia de mi", "serie": "Terraza 31", "ts": "2026-10-09 10:46", "llega": "", "texto": "La mejor frase que describe esto es una que voy a compartir.\n\nSeñor Jesús, ten misericordia de mí.\n\nPorque cuando yo me veo, cuando veo la realidad de lo que no veo, cuando veo la realidad de lo que sí veo, clamo.\n\n¿Y por qué soy capaz de clamar? Porque he conocido un poco más de la santidad de Dios, un poco más de la realidad espiritual. Y en esa realidad lo único que es mi salvación es Cristo.\n\nAunque Él se haya dado por completo, podemos seguir dejando al costado al que es la única vida. Y no es un Dios lejano. Es un Dios cercano, presente ahora.\n\nMás en elgransueno.org\n\n#elgransueno #Cristo #vidanueva #descanso #identidadenCristo"}, {"id": "r30-no-es-que-haces-sino-desde-donde", "titulo": "No es que haces sino desde donde", "serie": "Terraza 30", "ts": "2026-10-09 10:46", "llega": "", "texto": "Aprendimos muy bien a imitar a este Jesús. Tenemos una imagen de cómo es Jesús y por lo tanto imitamos lo que es Él.\n\n¿Pero sabés que todo lo que no nace de Él es muerte? Todo lo que no nace de esa vida nueva es nada. Es la carne intentando reproducir lo que no puede, crear lo que no puede.\n\nPor eso el hombre lucha y lucha y lucha.\n\nPero la Biblia te muestra muy bien qué pasa con las dos realidades. No es qué es lo que hagas. Es desde dónde, o quién es el que está viviendo.\n\nMás en elgransueno.org\n\n#elgransueno #Cristo #vidanueva #descanso #identidadenCristo"}, {"id": "r29-no-sabemos-vivir-en-libertad", "titulo": "No sabemos vivir en libertad", "serie": "Terraza 29", "ts": "2026-10-09 10:46", "llega": "", "texto": "De repente, en Cristo como vida, empezamos a conocer. Empezamos a perseverar en Él. Un camino de tomar tu cruz, claro que sí. Pero empezás a ver más.\n\nY cuando descubrimos lo que es la libertad, no sabemos andar en ella.\n\n¿Ahora qué? Sos libre. Mi valor está en Cristo, no cambia por lo que hacés ni por lo que no hacés.\n\n¿Ahora qué? ¿Podés crear lo que quieras? Claro.\n\nMás en elgransueno.org\n\n#elgransueno #Cristo #vidanueva #descanso #identidadenCristo"}, {"id": "r28-vivimos-dentro-de-murallas", "titulo": "Vivimos dentro de murallas", "serie": "Terraza 28", "ts": "2026-10-09 10:46", "llega": "", "texto": "Muchas veces vivimos en esta realidad de muralla. ¿Y cómo sabés si vivís en murallas? Algo que no te deja avanzar, una realidad que no podés ver, pero ahí está.\n\nNo hablo de las limitaciones reales que tenemos como humanidad, la fragilidad. Hablo de todo lo que opera en Adán.\n\nMiedo, y por lo tanto vamos al control. Insatisfacción, que no sabés ni por qué pero está ahí adentro. Falta de libertad en mil cosas.\n\nCulpa. Y no una culpa porque ayer hiciste lo que no querías hacer. Una culpa mucho más profunda, por cosas que pesan. El lugar donde estás, de dónde venís, qué tenés, qué no tenés. Vergüenza. Y otras características de este sistema operativo.\n\nMás en elgransueno.org\n\n#elgransueno #Cristo #vidanueva #descanso #identidadenCristo"}, {"id": "r27-la-muralla", "titulo": "La muralla", "serie": "Terraza 27", "ts": "2026-10-09 10:46", "llega": "", "texto": "Imaginate que toda la vida fuiste un esclavo y ni lo sabías. Y de repente viste que había una muralla más allá.\n\nY se abrió. Llamemos a eso gracia. Se abrió la muralla y saliste.\n\nTodo era diferente. No operan las reglas que operaban dentro de la muralla.\n\nY tenés tanto espacio para recorrer y tanta realidad que vivir, que no sabés cómo hacer.\n\nMás en elgransueno.org\n\n#elgransueno #Cristo #vidanueva #descanso #identidadenCristo"}, {"id": "r26-no-seas-el-protagonista", "titulo": "No seas el protagonista", "serie": "Terraza 26", "ts": "2026-10-09 10:46", "llega": "", "texto": "Este es un camino de pérdida del control. De pérdida del sistema en el que naciste y conocés, para empezar a conocer la vida nueva.\n\nAmigos, relajémonos. Aprendamos a no ser el protagonista, a no querer hacerlo todo.\n\nNuestro valor no está en lo que hacés. No está en lo que sabés. No está en con quién estás. No está en lo que tenés.\n\nNuestro valor está en lo único que tiene valor, que es Cristo. Por eso Pablo dice: Cristo en nosotros, esperanza de gloria.\n\nMás en elgransueno.org\n\n#elgransueno #Cristo #vidanueva #descanso #identidadenCristo"}, {"id": "r25-perseverar-no-es-facil", "titulo": "Perseverar no es facil", "serie": "Terraza 25", "ts": "2026-10-09 10:46", "llega": "", "texto": "Ese es mi verdadero discípulo.\n\nQuiero que veas la palabra de Dios no como algo que aprendiste, no como algo que te dijeron, sino como una revelación. Como una verdad que Dios te habló.\n\nY la perseverancia no es nada fácil. Es un proceso duro, de muerte, de dolor. Me gusta la imagen de la semilla que se cae y muere. Que se cae y echa raíces profundas.\n\nConocerán la verdad, y la verdad los hará libres. El conocer la verdad que te rompe la mentira está en la perseverancia.\n\nMás en elgransueno.org\n\n#elgransueno #Cristo #vidanueva #descanso #identidadenCristo"}, {"id": "r24-no-cuenta-nuestra-infidelidad", "titulo": "No cuenta nuestra infidelidad", "serie": "Terraza 24", "ts": "2026-10-09 10:46", "llega": "", "texto": "El que está haciendo la obra en vos es Dios. A través de circunstancias, de ambientes, de palabras.\n\nA medida que hay madurez, a medida que caminamos, hay un acuerdo mayor, hay una perseverancia mayor.\n\nY gracias a Dios que no cuenta nuestra infidelidad, sino la fidelidad de Él. Cuenta su obra eterna, su vida eterna en vos.\n\nEso es lo que permite que te caigas y te levantes quinientas veces. Lo que permite que aprendas de cada error. Lo que permite que perseveres.\n\nMás en elgransueno.org\n\n#elgransueno #Cristo #vidanueva #descanso #identidadenCristo"}, {"id": "r23-el-quiebre-es-la-rendicion", "titulo": "El quiebre es la rendicion", "serie": "Terraza 23", "ts": "2026-10-09 10:46", "llega": "", "texto": "¿Dónde está el quiebre total?\n\nEl quiebre total es cuando hay una rendición total. Me animo a todo hasta el fin. Me entrego por total. Estoy dispuesto a que mi existencia, mi vida, la entrego a Dios para que Él haga lo que quiera.\n\nA todo lugar donde Él quiera, yo estoy dispuesto.\n\nNo hay otra forma de caminar con Dios. Es rendición total. Solamente que es un proceso de día a día, de tomar tu cruz.\n\nMás en elgransueno.org\n\n#elgransueno #Cristo #vidanueva #descanso #identidadenCristo"}, {"id": "r22-largar-el-control", "titulo": "Largar el control", "serie": "Terraza 22", "ts": "2026-10-09 10:46", "llega": "", "texto": "Estoy en Albania estos días, caminando. Y hace varios meses que estoy en una transición interna que no logro comprender.\n\nEs una invitación de Dios a largar el control. A nadar en aguas que no nadé, aguas donde tenés muchos prejuicios, muchas opiniones. Aguas donde no hay un plan.\n\nPorque muchas veces sabemos cómo funciona, sabemos qué hacer, sabemos todo el plan. Y eso no está alineado con lo que significa ser guiado por el Señor.\n\nYa tenés el plan, ya tenés todo. Y lo que buscás es alguna forma de autojustificarte. Pero realmente vos sos el protagonista.\n\nMás en elgransueno.org\n\n#elgransueno #Cristo #vidanueva #descanso #identidadenCristo"}, {"id": "r13-resolver-las-cosas-solo", "titulo": "Resolver las cosas solo", "serie": "Terraza 13", "ts": "2026-10-09 10:46", "llega": "", "texto": "Voy a poder ver los resultados únicamente cuando me ponga de acuerdo con esa verdad y la deje gobernar mi vida.\n\nMientras eso no suceda, voy a estar tratando de resolver las cosas solo.\n\nMás en elgransueno.org\n\n#elgransueno #Cristo #vidanueva #descanso #identidadenCristo #descanso"}, {"id": "r14-te-hablo-de-la-vida", "titulo": "Te hablo de la vida", "serie": "Terraza 14", "ts": "2026-10-09 10:46", "llega": "", "texto": "Cuando hice esta pregunta en la calle, casi todos me hablaron de plata. De trabajo. De culpas ajenas, del gobierno.\nY es lógico: sobrevivir es lo que nos enseñaron.\n\nPero la vida que Dios da no se mide en lo que juntamos.\nSe nota en cosas chicas que el apuro no nos deja ver.\nUna mañana. Un saludo. Alguien que necesitaba que lo miraras.\n\nCristo no vino a prometernos un después mejor.\nVino a darnos vida, y la vida siempre pasa hoy.\n\nEl video completo, Hacés cosas para Dios y no sentís nada, está en YouTube (@adrianencamino).\nMás en elgransueno.org, link en la bio. El gran sueño de Dios también se vive en lo pequeño.\n\n#ElGranSueno #ElGranSuenoDeDios #vivirelpresente #vidanueva #Cristo"}, {"id": "r11-no-sos-el-protagonista", "titulo": "No sos el protagonista", "serie": "Terraza 11", "ts": "2026-10-09 10:46", "llega": "", "texto": "Nos enseñaron a ser protagonistas.\nA manejarlo todo, a resolver solos, a sostener.\nY así se vive cansado.\n\nLa buena noticia es que la historia no gira alrededor tuyo.\nEs la historia de amor de Dios con nosotros. Él la empezó, Él la sostiene, Él la termina.\n\nCuando lo olvidamos vivimos desequilibrados.\nY lideramos así: pasamos cansancio en lugar de vida.\n\nSoltar el protagonismo no es perder. Es rendirse, y dejar que Cristo se exprese a través nuestro.\n\nEl video completo, Hacés cosas para Dios y no sentís nada, está en YouTube (@adrianencamino).\nMás en elgransueno.org, link en la bio. En el gran sueño de Dios el protagonista es Él, y nosotros estamos adentro.\n\n#ElGranSueno #ElGranSuenoDeDios #liderazgo #descanso #Cristo"}, {"id": "r10-como-mide-dios-el-exito", "titulo": "Como mide dios el exito", "serie": "Terraza 10", "ts": "2026-10-09 10:46", "llega": "", "texto": "El mundo mide el éxito con números: seguidores, plata, me gusta. Dios mide otra cosa. Mide la obediencia.\n\nHay procesos de soledad, de abandono, de traición, que no llegan para hundirte. Llegan para que Cristo sea suficiente. Ahí se aprende a no negociar y a seguir adorando en el momento difícil.\n\nEl que levanta es Dios. No es un camino que tenés que ganarte: es la vida de Cristo en vos, que ya te fue dada.\n\nEl video completo, Pensás que estás creciendo. Y quizás no, está en YouTube (@adrianencamino).\nEn elgransueno.org conectamos a los que están viviendo el gran sueño de Dios. Link en la bio.\n\n#ElGranSueñoDeDios #ElGranSueño #CristoEnNosotros #CristoMiVida #Obediencia #Mateo621"}, {"id": "r09-debo-menguar", "titulo": "Debo menguar", "serie": "Terraza 09", "ts": "2026-10-09 10:46", "llega": "", "texto": "Lo decimos fácil: debo menguar para que Él crezca. Pero en la práctica, lo que más hacemos es pelearnos con lo que Dios está haciendo.\n\nMenguar no es un ejercicio de humildad que logramos a fuerza de voluntad. Es entender, de a poco, que hay una sola vida que tiene que crecer en nosotros, y que no es la nuestra.\n\nCuando el alma deja de pelear, empieza a caminar alineada. Y ahí se ve lo que siempre fue verdad: Cristo es mi vida.\n\nEl video completo, Pensás que estás creciendo. Y quizás no, está en YouTube (@adrianencamino).\nEn elgransueno.org conectamos a los que están viviendo el gran sueño de Dios. Link en la bio.\n\n#ElGranSueñoDeDios #ElGranSueño #CristoEnNosotros #CristoMiVida #Reposo #Juan330"}, {"id": "r08-la-vida-de-la-cual-naciste", "titulo": "La vida de la cual naciste", "serie": "Terraza 08", "ts": "2026-10-09 10:46", "llega": "", "texto": "Decimos nací de nuevo con mucha facilidad. Pero pocas veces nos detenemos a mirar qué vida es la que nació en nosotros.\n\nNo es la vieja con otra ropa. Es la vida de Cristo, la vida del que está completo, y por eso en Él estamos completos. No hay que agregarle nada.\n\nEsa vida va a crecer, va a gobernar, y es la que la gente necesita ver. No tu esfuerzo, no tu mejor versión: la luz que ya está en vos.\n\nEl video completo, Pensás que estás creciendo. Y quizás no, está en YouTube (@adrianencamino).\nEn elgransueno.org conectamos a los que están viviendo el gran sueño de Dios. Link en la bio.\n\n#ElGranSueñoDeDios #ElGranSueño #CristoEnNosotros #CristoMiVida #NuevaVida #Luz"}, {"id": "r07-se-derrumba-para-que-te-muevas", "titulo": "Se derrumba para que te muevas", "serie": "Terraza 07", "ts": "2026-10-09 10:46", "llega": "", "texto": "Antes de esta parte venía hablando de la gratitud y de confiar cuando todo parece venirse abajo.\n\nA veces lo que se derrumba no es un castigo ni un error. Es Dios moviendo el nido para que dejes un lugar que ya te quedó chico. Y sí, duele: una parte tuya se muere.\n\nPero crecer no es que vos crezcas. Es que Cristo crezca en vos, porque tu vida está ahí. Él es tu vida, tu propósito, la imagen perfecta. No hay otra.\n\nEl video completo, Pensás que estás creciendo. Y quizás no, está en YouTube (@adrianencamino).\nEn elgransueno.org conectamos a los que están viviendo el gran sueño de Dios. Link en la bio.\n\n#ElGranSueñoDeDios #ElGranSueño #CristoEnNosotros #CristoMiVida #NuevaVida #Deuteronomio3211"}, {"id": "r06-dios-tiene-un-sueno", "titulo": "Dios tiene un sueno", "serie": "Terraza 06", "ts": "2026-10-09 10:46", "llega": "", "texto": "En la charla venía diciendo que crecer muchas veces duele: hay procesos, quebrantamiento, alineamiento. Y en medio de eso apareció esto.\n\nEso que en vos nunca terminó de encajar, tu manera de ver, de sentir, de trabajar, no es un error de fábrica. Dios tiene un sueño, y te incluyó en él.\n\nEl instrumento no se toca solo. No se trata de mostrar lo que tenés, sino de que Cristo, que es tu vida, se mueva a través tuyo con total libertad.\n\nEl video completo, Pensás que estás creciendo. Y quizás no, está en YouTube (@adrianencamino).\nEn elgransueno.org conectamos a los que están viviendo el gran sueño de Dios. Link en la bio.\n\n#ElGranSueñoDeDios #ElGranSueño #CristoEnNosotros #CristoMiVida #Libertad #GranComisión"}, {"id": "r04-lo-que-te-trajo-hasta-aca", "titulo": "Lo que te trajo hasta aca", "serie": "Terraza 04", "ts": "2026-10-09 10:46", "llega": "", "texto": "En esta parte de la charla venía hablando de una transición que estamos atravesando todos.\n\nLo que te protegió, lo que te hizo fuerte, lo que te ayudó a sobrevivir, en su momento fue un regalo.\nPero Dios no te llamó a sostener la vida vieja con mejores herramientas.\n\nCrecer no es sumarle cosas a lo que ya eras. Es soltar lo que te trajo hasta acá, para que la vida de Cristo, la única que hay en vos, se exprese sin tus defensas en el medio.\nNo se pierde nada que valga. Se gana a Cristo.\n\nEl video completo, Pensás que estás creciendo. Y quizás no, está en YouTube (@adrianencamino).\nEn elgransueno.org conectamos a los que están viviendo el gran sueño de Dios. Link en la bio.\n\n#ElGranSueñoDeDios #ElGranSueño #CristoEnNosotros #CristoMiVida #Libertad #Filipenses37"}, {"id": "peli-10-samaritana", "titulo": "Sabe todo lo que hiciste y vino igual", "serie": "Películas 10", "ts": "2026-10-09 10:46", "llega": "2026-10-11T12:25", "texto": "¿Y si Él sabe todo lo que hiciste y vino a buscarte igual?\n\nElla iba a buscar agua al mediodía, con el calor más fuerte, porque a esa hora no había nadie. Ninguna mujer quería ser vista con ella. Cinco esposos, y el hombre con el que vivía no era su esposo.\n\nY en el pozo hay un judío que le habla. Le dice toda su historia sin que ella la cuente. Ella se defiende como se defiende cualquiera que vivió años bajo la mirada de los demás: ¿vienes a darme un sermón? Y Él responde: no vine a condenarte.\n\nElla dice que nunca recibió nada de Dios, que hasta que venga el Mesías y arregle este embrollo, incluyéndola a ella, no va a confiar en nadie. Y Jesús le dice: ese Mesías del que hablas, ese soy yo.\n\nSoy rechazada por todos. Lo sé. Pero no por el Mesías.\n\nÉl no se acercó a ella después de que cambiara. Se acercó sabiendo todo. Mas Dios encarece su caridad para con nosotros, porque siendo aún pecadores, Cristo murió por nosotros (Romanos 5:8). Y lo que le ofreció no fue una regla más: el agua que yo le daré, será en él una fuente de agua que salte para vida eterna (Juan 4:14). Una vida nueva adentro, que no depende de lo que ella había hecho.\n\nPor eso salió corriendo al pueblo, el mismo pueblo que la evitaba, a decir: este hombre me dijo todo lo que he hecho.\n\nMás enseñanzas en YouTube (@adrianencamino) y en elgransueno.org. Link en el perfil.\n\n#ElGranSueñoDeDios #ElGranSueño #CristoEnNosotros #CristoMiVida #LosElegidos #LaSamaritana #Gracia"}, {"id": "peli-15-robots", "titulo": "Hay sueños que no nacieron en vos", "serie": "Películas 15", "ts": "2026-10-10 12:45", "llega": "2026-10-11T18:25", "texto": "¿Hay un sueño que no te deja en paz?\n\nHay sueños que no nacieron en vos. Nacieron de Dios y tienen que ver con vos. No tienen que ver solo con lo que podés hacer, sino con quién sos, con la razón por la que naciste. Por eso esos deseos siempre van a estar y te van a perseguir: tienen que ver con tu esencia, con Dios guiándote hacia eso.\n\nRodney quería ser alguien. Y su mamá le dice algo que todavía no entiende: ya eres alguien. No vas tras ese sueño para llegar a ser alguien. Vas porque ya lo sos.\n\nEl gran reto es que caminar hacia eso es morir a lo viejo. Perder la mentalidad que te deja quieto, las mentiras que te quieren dejar en arresto, tanta herencia que quizás te mantuvo lejos de lo que no podés imaginar.\n\nY lo que está del otro lado no es una mejor versión de vos: es la vida de Cristo manifestada en plenitud. Cosas que ojo no vio, ni oreja oyó, ni han subido en corazón de hombre, son las que ha Dios preparado para aquellos que le aman (1 Corintios 2:9).\n\nMás enseñanzas en YouTube (@adrianencamino) y en elgransueno.org. Link en el perfil.\n\n#ElGranSueñoDeDios #ElGranSueño #CristoEnNosotros #CristoMiVida #Robots #Propósito #Identidad"}, {"id": "peli-14-nicodemo", "titulo": "Nadie se esfuerza para nacer", "serie": "Películas 14", "ts": "2026-10-10 12:53", "llega": "2026-10-12T12:25", "texto": "¿Cuánto tiempo llevás intentando portarte como hijo de Dios?\n\nNicodemo era maestro de Israel. Conocía la ley de memoria, oraba, ayunaba, enseñaba. Una noche fue a ver a Jesús, y Jesús no le habló de hacer más. Le habló de nacer: De cierto, de cierto te digo, que el que no naciere otra vez, no puede ver el reino de Dios (Juan 3:3).\n\nCuando Jesús le dice que no comprende, Nicodemo responde: lo intento, Rabino. Y ahí está todo. Nadie se esfuerza para nacer. Nacer es algo que te pasa, no algo que lográs.\n\nLa religión le enseña al hombre viejo a comportarse mejor. El evangelio no mejora lo viejo: te da un nacimiento nuevo. No es tu naturaleza arreglada, es la vida de Cristo en vos. Lo que es nacido de la carne, carne es; y lo que es nacido del Espíritu, espíritu es (Juan 3:6).\n\nY no vino a condenarte por no haberlo logrado. Porque no envió Dios a su Hijo al mundo para que condene al mundo, mas para que el mundo sea salvo por él (Juan 3:17).\n\nTodo esfuerzo por parecer agota; el descanso está en ser. No tenés que actuar como hijo: fuiste hecho hijo.\n\nMás enseñanzas en YouTube (@adrianencamino) y en elgransueno.org. Link en el perfil.\n\n#ElGranSueñoDeDios #ElGranSueño #CristoEnNosotros #CristoMiVida #LosElegidos #NacerDeNuevo #NuevaVida"}, {"id": "peli-19-matrix", "titulo": "¿Y si tu realidad es la mentira?", "serie": "Películas 19", "ts": "2026-10-09 21:19", "llega": "2026-10-12T18:25", "texto": "¿Y si lo que llamás realidad es la mentira?\n\nMorfeo le dice a Neo algo que muchos sentimos: hay algo mal en el mundo. No sabés qué es, pero está ahí, como una astilla en la mente. Y lo sentiste toda la vida.\n\nLa mentira más fuerte no es la que te dicen. Es la que te acostumbraste a vivir. Que sos lo que hacés. Que tenés que ganarte el amor. Que Dios está lejos y vos tenés que alcanzarlo. Una prisión que no podés tocar, pero que te maneja.\n\nJesús no vino a darte una idea más para creer. Vino a despertarte a una realidad. Y conoceréis la verdad, y la verdad os libertará (Juan 8:32). No mirando nosotros a las cosas que se ven, sino a las que no se ven: porque las cosas que se ven son temporales, mas las que no se ven son eternas (2 Corintios 4:18).\n\nLa verdad no es un concepto. Es una Persona. Y cuando despertás en Él, ya no hay marcha atrás.\n\nMás enseñanzas en YouTube (@adrianencamino) y en elgransueno.org. Link en el perfil.\n\n#ElGranSueñoDeDios #ElGranSueño #CristoEnNosotros #CristoMiVida #Matrix #LaVerdad #Libertad"}, {"id": "peli-21-interestelar", "titulo": "Salió a salvar el mundo y se perdió a sus hijos", "serie": "Películas 21", "ts": "2026-10-09 21:19", "llega": "2026-10-13T12:25", "texto": "¿Qué te estás perdiendo mientras perseguís la misión?\n\nCooper salió a salvar el mundo. Una misión enorme, importante, necesaria. Y mientras tanto, del otro lado de la pantalla, pasaron 23 años. Su hijo creció, se casó, tuvo un hijo, lo perdió. Su hija cumplió la edad que él tenía cuando se fue.\n\nMuchos que soñamos con la Gran Comisión vivimos así. Corriendo hacia un llamado que siempre está más adelante, y perdiéndonos a los que tenemos al lado. Como si el propósito estuviera lejos del presente.\n\nPero el gran sueño de Dios no es algo que hacés para Él lejos de tu casa. Es Su vida en vos, donde estás, hoy. Porque ¿qué aprovechará al hombre, si granjeare todo el mundo, y pierde su alma? (Marcos 8:36). El que está en mí, y yo en él, éste lleva mucho fruto (Juan 15:5).\n\nLa misión empieza con los que tenés adelante.\n\nMás enseñanzas en YouTube (@adrianencamino) y en elgransueno.org. Link en el perfil.\n\n#ElGranSueñoDeDios #ElGranSueño #CristoEnNosotros #CristoMiVida #Interestelar #GranComisión #Familia"}, {"id": "peli-20-bruce", "titulo": "Cuando dejás de querer ser Dios", "serie": "Películas 20", "ts": "2026-10-09 21:19", "llega": "2026-10-13T18:25", "texto": "¿Qué pasa cuando dejás de querer ser Dios?\n\nBruce tuvo todo el poder que quiso. Y lo usó para él: para su carrera, para su imagen, para tener razón. Y aun así perdió lo que más amaba.\n\nHasta que deja de pelear. Y cuando Dios le pregunta qué es lo que le importa, por primera vez no pide nada para él: quiero que ella sea feliz, no importa lo que implique. Y Dios le responde: esa es una plegaria.\n\nRendirse no es perder. Es dejar de sostener tu vida con tus manos y entrar al descanso. Jesús mismo oró así: Padre, si quieres, pasa este vaso de mí; empero no se haga mi voluntad, sino la tuya (Lucas 22:42).\n\nY del otro lado de la rendición no hay vacío. Hay vida. Con Cristo estoy juntamente crucificado, y vivo, no ya yo, mas vive Cristo en mí (Gálatas 2:20).\n\nMás enseñanzas en YouTube (@adrianencamino) y en elgransueno.org. Link en el perfil.\n\n#ElGranSueñoDeDios #ElGranSueño #CristoEnNosotros #CristoMiVida #Todopoderoso #Rendición #Descanso"}, {"id": "peli-18-buzz", "titulo": "Cuando se cae lo que creías ser", "serie": "Películas 18", "ts": "2026-10-09 21:19", "llega": "2026-10-14T12:25", "texto": "¿Qué pasa cuando se cae la identidad que te armaste?\n\nBuzz estaba seguro de quién era: un guardián del espacio, capaz de volar, con una misión. Hasta que vio la publicidad. No es un juguete volador. Disponible en todas las tiendas.\n\nY aun así sube, abre las alas y salta. Porque cuando tu identidad depende de lo que podés hacer, no la soltás aunque te rompa.\n\nMuchos vivimos así. Sos lo que lográs, lo que sabés hacer, lo que los demás ven en vos. Y el día que eso se cae, sentís que ya no sos nadie.\n\nPero tu identidad nunca estuvo en tu capacidad. Está en de quién sos. Porque muertos sois, y vuestra vida está escondida con Cristo en Dios (Colosenses 3:3). He aquí que en las palmas te tengo esculpida (Isaías 49:16).\n\nLo que hacés no es lo que sos. Sos de Alguien.\n\nMás enseñanzas en YouTube (@adrianencamino) y en elgransueno.org. Link en el perfil.\n\n#ElGranSueñoDeDios #ElGranSueño #CristoEnNosotros #CristoMiVida #ToyStory #Identidad #HijosDeDios"}, {"id": "peli-17-desmond", "titulo": "Cuando ya no te queda fuerza", "serie": "Películas 17", "ts": "2026-10-09 21:19", "llega": "2026-10-14T18:25", "texto": "¿Te pasó de no tener más fuerza y que igual te toque seguir?\n\nDesmond Doss estaba solo y agotado, después de que todos se retiraron. Y le pregunta a Dios: ¿qué es lo que quieres de mí? No te escucho. Y en ese momento escucha los gritos: ¡médico!, ¡ayúdenme!\n\nNo se armó de fuerza. No hizo un plan heroico. Oró. Y volvió a buscar uno. Y después otro. Ayúdame a encontrar uno más.\n\nAsí se vive desde Él. No es tu fuerza la que sostiene la misión: es Su vida obrando en vos, hoy, con el que tenés adelante. Tenemos empero este tesoro en vasos de barro, para que la alteza del poder sea de Dios, y no de nosotros (2 Corintios 4:7).\n\nÉl da esfuerzo al cansado, y multiplica las fuerzas al que no tiene ningunas. Mas los que esperan a Jehová tendrán nuevas fuerzas; levantarán las alas como águilas, correrán, y no se cansarán, caminarán, y no se fatigarán (Isaías 40:29-31).\n\nNo tenés que ser fuerte. Tenés que estar en Él.\n\nMás enseñanzas en YouTube (@adrianencamino) y en elgransueno.org. Link en el perfil.\n\n#ElGranSueñoDeDios #ElGranSueño #CristoEnNosotros #CristoMiVida #HastaElÚltimoHombre #Fuerza #Descanso"}];
const CLAVE = "tiktok-pegados";
let pegados = {};
try { pegados = JSON.parse(localStorage.getItem(CLAVE) || "{}") || {}; } catch (e) { pegados = {}; }
let vista = "pend";
function guardar() { try { localStorage.setItem(CLAVE, JSON.stringify(pegados)); } catch (e) {} }
function fecha(ts) {
  const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(ts || ""); return m ? m[3] + "/" + m[2] : "";
}
async function copiar(texto, boton, pre) {
  try { await navigator.clipboard.writeText(texto); boton.textContent = "Copiado"; boton.classList.add("listo"); }
  catch (e) {
    pre.classList.add("abierto");
    const r = document.createRange(); r.selectNodeContents(pre);
    const s = getSelection(); s.removeAllRanges(); s.addRange(r);
    boton.textContent = "Seleccionado, copialo";
  }
  setTimeout(() => { boton.textContent = "Copiar texto"; boton.classList.remove("listo"); }, 2200);
}
function pintar() {
  const lista = document.getElementById("lista");
  lista.textContent = "";
  const pend = DATOS.filter(d => !pegados[d.id]), peg = DATOS.filter(d => pegados[d.id]);
  document.getElementById("n-pend").textContent = "(" + pend.length + ")";
  document.getElementById("n-peg").textContent = "(" + peg.length + ")";
  document.getElementById("tab-pend").setAttribute("aria-pressed", vista === "pend");
  document.getElementById("tab-peg").setAttribute("aria-pressed", vista === "peg");
  const ver = vista === "pend" ? pend : peg;
  if (!ver.length) {
    const p = document.createElement("p"); p.className = "vacio";
    p.textContent = vista === "pend" ? "No queda ningún texto por pegar." : "Todavía no marcaste ninguno como pegado.";
    lista.appendChild(p); return;
  }
  for (const d of ver) {
    const f = document.createElement("article"); f.className = "ficha" + (pegados[d.id] ? " pegado" : "");
    const cab = document.createElement("div"); cab.className = "cab";
    const se = document.createElement("span"); se.className = "serie"; se.textContent = d.serie;
    const fe = document.createElement("span"); fe.className = "fecha" + (d.llega ? " llega" : "");
    fe.textContent = d.llega ? "llega al inbox el " + fecha(d.llega) : "en el inbox";
    cab.append(se, fe);
    const t = document.createElement("h2"); t.className = "tit"; t.textContent = d.titulo;
    const pre = document.createElement("p"); pre.className = "texto"; pre.textContent = d.texto;
    const ac = document.createElement("div"); ac.className = "acciones";
    const bc = document.createElement("button"); bc.className = "btn copiar"; bc.textContent = "Copiar texto";
    bc.addEventListener("click", () => copiar(d.texto, bc, pre));
    const bv = document.createElement("button"); bv.className = "btn sec"; bv.textContent = "Ver todo";
    bv.addEventListener("click", () => { pre.classList.toggle("abierto"); bv.textContent = pre.classList.contains("abierto") ? "Achicar" : "Ver todo"; });
    const bm = document.createElement("button"); bm.className = "btn sec marcar";
    bm.setAttribute("aria-pressed", !!pegados[d.id]); bm.textContent = pegados[d.id] ? "Pegado" : "Ya lo pegué";
    bm.addEventListener("click", () => { if (pegados[d.id]) delete pegados[d.id]; else pegados[d.id] = 1; guardar(); pintar(); });
    ac.append(bc, bv, bm);
    f.append(cab, t, pre, ac);
    lista.appendChild(f);
  }
}
document.getElementById("tab-pend").addEventListener("click", () => { vista = "pend"; pintar(); });
document.getElementById("tab-peg").addEventListener("click", () => { vista = "peg"; pintar(); });
pintar();
</script>
</html>
