lamaba Mateo; y dícele: Sígueme. Y se levantó, y le siguió (Mateo 9:9).\n\nNo le pidió que cambiara primero. No le puso condiciones. Lo llamó así como estaba. Mas Dios encarece su caridad para con nosotros, porque siendo aún pecadores, Cristo murió por nosotros (Romanos 5:8).\n\nY cuando Mateo dice no soy bienvenido a las cenas, Jesús le responde: esta noche, tú invitas. Así que ya no sois extranjeros ni advenedizos, sino juntamente ciudadanos con los santos, y domésticos de Dios (Efesios 2:19).\n\nEn Él ya no sos el que nadie quiere. Sos de la casa.\n\nMás enseñanzas en YouTube (@adrianencamino) y en elgransueno.org. Link en el perfil.\n\n#ElGranSueñoDeDios #ElGranSueño #CristoEnNosotros #CristoMiVida #LosElegidos #Gracia #Sígueme"}, {"id": "peli-23-mujer", "titulo": "Doce años sin que nadie la tocara", "serie": "Películas 23", "ts": "2026-10-09 21:23", "llega": "", "texto": "¿Cuánto tiempo llevás cargando algo que nadie pudo sanar?\n\nDoce años. Doce años sangrando, gastando todo en médicos y empeorando. Para la ley estaba impura: nadie podía tocarla, y todo lo que ella tocaba quedaba sucio. Doce años sin un abrazo.\n\nY se mete entre la multitud con una sola idea: si solo toco la orilla de su manto. Y la toca. Y Jesús se detiene. ¿Quién me tocó?\n\nElla tiembla. Cree que la van a echar otra vez. Yo ya no soy hija de nadie, dice. Y Jesús la mira y le dice lo que nadie le había dicho en años. Y él le dijo: Hija, tu fe te ha salvado: ve en paz (Lucas 8:48).\n\nNo fue un pedazo de tela. Fue Él. Y no solo la sanó: le devolvió el nombre. Mirad cuál amor nos ha dado el Padre, que seamos llamados hijos de Dios (1 Juan 3:1).\n\nLo que te hizo sentir lejos no tiene la última palabra. Él te llama hijo. Te llama hija.\n\nMás enseñanzas en YouTube (@adrianencamino) y en elgransueno.org. Link en el perfil.\n\n#ElGranSueñoDeDios #ElGranSueño #CristoEnNosotros #CristoMiVida #LosElegidos #HijosDeDios #Gracia"}, {"id": "peli-12-leproso", "titulo": "Lo que te hace intocable no lo detiene", "serie": "Películas 12", "ts": "2026-10-09 21:19", "llega": "", "texto": "¿Hay algo en vos que creés que hace que Dios se aleje?\n\nUn leproso no podía acercarse a nadie. Tenía que gritar impuro para que la gente se apartara. Nadie lo tocaba, y la ley decía que el que tocara a un leproso quedaba impuro.\n\nPor eso los discípulos gritan: es un leproso, atrás. Y él, en el suelo, solo pide una cosa: por favor, no te alejes de mí.\n\nJesús no se aleja. Y Jesús, teniendo misericordia de él, extendió su mano, y le tocó, y le dice: Quiero, sé limpio (Marcos 1:41).\n\nLo tocó antes de que estuviera limpio. Y no fue la lepra la que pasó a Jesús: fue la vida de Jesús la que pasó al leproso. Su santidad es más fuerte que tu impureza. Lo que te hacía intocable no lo detiene.\n\nPor eso no tenés que limpiarte primero para acercarte. Él ya se acercó. Y lo que hace no es arreglar al viejo hombre: es darte su vida. De modo que si alguno está en Cristo, nueva criatura es (2 Corintios 5:17).\n\nMás enseñanzas en YouTube (@adrianencamino) y en elgransueno.org. Link en el perfil.\n\n#ElGranSueñoDeDios #ElGranSueño #CristoEnNosotros #CristoMiVida #LosElegidos #Gracia #NuevaVida"}, {"id": "peli-11-santiago", "titulo": "¿Por qué Dios no te sanó todavía?", "serie": "Películas 11", "ts": "2026-10-09 21:19", "llega": "", "texto": "¿Y si tu debilidad no es un castigo, sino una confianza?\n\nSantiago caminaba con dificultad. Jesús lo estaba enviando a sanar enfermos, y él no entendía: ¿cómo voy a sanar a otros con esta condición que vos no curaste?\n\nJesús le pregunta si quiere ser sanado. Sí. ¿Y por qué no lo hiciste? Porque confío en ti.\n\nNo lo sanó en ese momento, y no fue por falta de amor. Le confió algo que pocos pueden llevar: proclamar el nombre de Dios a pesar de esto, ser paciente en el sufrimiento sabiendo que la eternidad no tiene sufrimiento. ¿A cuántas personas crees que el Padre y yo les confiamos esto? No a muchas.\n\nPablo pidió tres veces que le quitaran su aguijón, y la respuesta fue: Bástate mi gracia; porque mi potencia en la flaqueza se perfecciona (2 Corintios 12:9).\n\nDios nunca te pidió que fueras fuerte. La fuerza real no sale de lo que vos podés. Es la vida de Cristo en vos, que se ve justamente donde vos no podés. Por eso Pablo termina diciendo: de buena gana me gloriaré más bien en mis flaquezas, porque habite en mí la potencia de Cristo.\n\nMás enseñanzas en YouTube (@adrianencamino) y en elgransueno.org. Link en el perfil.\n\n#ElGranSueñoDeDios #ElGranSueño #CristoEnNosotros #CristoMiVida #LosElegidos #Fragilidad #Gracia"}, {"id": "peli-08-narnia", "titulo": "¿Quién pagó lo que hiciste?", "serie": "Películas 08", "ts": "2026-10-09 21:19", "llega": "", "texto": "En Narnia, Edmund traicionó a sus hermanos. Y la ley más antigua de ese mundo, la gran magia, decía que la vida de todo traidor le pertenece a la Bruja.\n\nAslan no discutió la ley. Se entregó en su lugar. Esa noche lo ataron a la mesa de piedra y la Bruja se burló: ¿en serio creíste que al sacrificarte lograrías salvar al humano traidor? Estás dándome tu vida sin salvar a nadie.\n\nAl amanecer la mesa estaba partida en dos y Aslan estaba vivo. Había una magia más profunda: cuando una víctima voluntaria que no cometió traición muere en lugar de un traidor, la mesa de piedra se rompe y la muerte misma da marcha atrás.\n\nLa ley estaba escrita en piedra y era justa: la paga del pecado es muerte. No hacía falta borrar la ley. Hacía falta que un inocente cargara con ella en tu lugar. Al que no conoció pecado, hizo pecado por nosotros, para que nosotros fuésemos hechos justicia de Dios en él (2 Corintios 5:21).\n\nPor eso la cédula que nos era contraria fue quitada de en medio y clavada en la cruz (Colosenses 2:14). Y el mismo versículo que dice que la paga del pecado es muerte termina así: mas la dádiva de Dios es vida eterna en Cristo Jesús Señor nuestro (Romanos 6:23).\n\nNo te define lo que hiciste. Te define lo que Él hizo. Ya no sos el traidor: sos justicia de Dios en Él.\n\nMás enseñanzas en YouTube (@adrianencamino) y en elgransueno.org. Link en el perfil.\n\n#ElGranSueñoDeDios #ElGranSueño #CristoEnNosotros #CristoMiVida #Narnia #Aslan #Gracia"}, {"id": "r08-nuestra-gran-guerra", "titulo": "Nuestra gran guerra", "serie": "Terraza 08", "ts": "2026-10-09 18:18", "llega": "", "texto": "Nuestra gran guerra está en nuestra manera de querer entender las cosas.\n\nEn no atrevernos a rendirnos del todo. En querer controlar. En seguir sobreviviendo.\n\nPero la única vida que Dios llama vida es Cristo en nosotros.\n\nMás en elgransueno.org\n\n#elgransueno #Cristo #vidanueva #descanso #identidadenCristo #rendicion"}, {"id": "c3-el-aceite-de-oliva-es-de-ricos", "titulo": "En China el aceite de oliva es de ricos", "serie": "China en Tirana 3", "ts": "2026-10-19 22:56", "llega": "en cola", "texto": "Le pregunté a mi amigo qué aceite se usa en China y me respondió con una palabra que yo no conocía: huāshēng yóu, aceite de maní. De ahí pasamos a los precios, a la pasta y a cómo se vive allá.\n\nViajar es eso: sentarte a la mesa con alguien que nunca habrías conocido y descubrir que una pregunta simple abre una conversación entera. Y a veces esa puerta termina llevando a Cristo.\n\nEl video completo de esos días en Tirana está en YouTube (@adrianencamino).\nEn elgransueno.org conectamos a los que están viviendo el gran sueño de Dios. Link en la bio.\n\n#ElGranSueñoDeDios #ElGranSueño #CristoEnNosotros #CristoMiVida #China #Tirana"}, {"id": "b15-eso-no-sos-vos", "titulo": "B15 eso no sos vos", "serie": "La guerra en tu mente 15", "ts": "2026-10-20 08:18", "llega": "en cola", "texto": "Hay cosas en vos que no sos vos. Y en tu hermano también.\n\nLo que nos define no es eso: es nuestra unión con Cristo, la obra consumada, la cruz. Mirarnos así cambia cómo nos tratamos y cómo tratamos a los demás.\n\nEl video completo, La guerra en tu mente, está en YouTube (@adrianencamino).\nEn elgransueno.org conectamos a los que están viviendo el gran sueño de Dios. Link en la bio.\n\n#ElGranSueñoDeDios #ElGranSueño #CristoEnNosotros #CristoMiVida #Plenitud #Gracia"}, {"id": "r01-diseno", "titulo": "Diseno", "serie": "Terraza 01", "ts": "2026-10-25 08:30", "llega": "en cola", "texto": "Un amigo estaba enojado porque nunca fuimos libres, ya que siempre hay una decisión que tomar. Pero poder elegir es parte del diseño: Dios nos hizo con esa posibilidad, y cada elección trae consecuencias de las que somos responsables.\n\nEl problema no es la libertad. Es creer que el diseño de Dios no es bueno. Desde el origen había un árbol en el centro, el de la vida, y lo que se elige muestra qué pensamos del que nos creó.\n\nEl diseño es perfecto, en gran manera bueno, y apenas conocemos un uno por ciento. Se empieza a ver con la mente de Cristo, con su vida en nosotros.\n\nMás enseñanzas en YouTube (@adrianencamino) y escritos en elgransueno.org. Link en la bio.\n\n#ElGranSueñoDeDios #ElGranSueño #CristoEnNosotros #CristoMiVida #Libertad #Responsabilidad"}, {"id": "b13-una-guerra-con-vos-mismo", "titulo": "B13 una guerra con vos mismo", "serie": "La guerra en tu mente 13", "ts": "2026-10-20 08:06", "llega": "2026-10-26T19:00", "texto": "Cristo es suficiente. Y aun así hay una guerra adentro, con uno mismo.\n\nNo es contra Dios: es contra las fuentes que aprendimos a usar para sostenernos. Mirar lo que Él ya hizo nos lleva a perder lo que nos definía pero no nos sustentaba. Esa pérdida es vida.\n\nEl video completo, La guerra en tu mente, está en YouTube (@adrianencamino).\nEn elgransueno.org conectamos a los que están viviendo el gran sueño de Dios. Link en la bio.\n\n#ElGranSueñoDeDios #ElGranSueño #CristoEnNosotros #CristoMiVida #Libertad #NuevaVida"}, {"id": "peli-81-perdon", "titulo": "¿Cuántas veces hay que perdonar?", "serie": "Películas 81", "ts": "2026-10-25T12:43:17", "llega": "2026-10-26T21:30", "texto": "¿Cuántas veces tenés que perdonar a quien no te lo pidió?\n\nMateo le dice a Pedro: perdón por lo que te hice, y el perdón sería un obsequio tuyo, no tenés que darlo. Del otro lado, Pedro tiene que decidir qué hace con lo que le dolió. Y Jesús le contesta lo que a todos nos descoloca: no siete, setenta veces siete.\n\nCon nuestra fuerza perdonar se agota. A la segunda ofensa ya no alcanza, y empezamos a llevar la cuenta. Setenta veces siete no es un número: es la manera en que Dios perdona, y hoy esa vida está en nosotros. No perdonamos para ganarnos nada. Perdonamos porque ya fuimos perdonados.\n\nOs vivificó juntamente con él, perdonándoos todos los pecados (Colosenses 2:13).\n\nEste espacio es tuyo: elgransueno.org\n\nMás enseñanzas en YouTube (@adrianencamino) y en elgransueno.org. Link en el perfil.\n\n#ElGranSueñoDeDios #ElGranSueño #CristoEnNosotros #CristoMiVida #Libertad #Reposo #LosElegidos"}, {"id": "b14-si-ya-esta-hecho-por-que-peleo", "titulo": "B14 si ya esta hecho por que peleo", "serie": "La guerra en tu mente 14", "ts": "2026-10-20 08:13", "llega": "2026-10-27T11:00", "texto": "Consumado es. Hecho, terminado, para siempre.\n\nEntonces, ¿por qué seguimos peleando? Porque dejamos la realidad de Cristo para un día lejano, y no la conocemos hoy. Lo que está en Él no se conquista: se ve.\n\nEl video completo, La guerra en tu mente, está en YouTube (@adrianencamino).\nEn elgransueno.org conectamos a los que están viviendo el gran sueño de Dios. Link en la bio.\n\n#ElGranSueñoDeDios #ElGranSueño #CristoEnNosotros #CristoMiVida #CristoNuestraVida #Libertad"}, {"id": "r03-identidad", "titulo": "Identidad", "serie": "Terraza 03", "ts": "2026-10-25 08:31", "llega": "2026-10-27T15:00", "texto": "Una mentira solo tiene poder cuando te identificás con ella. Si alguien se burla de algo que no sos, ni te roza. Pero si cae sobre una herida y la creés, reaccionás.\n\nPor eso la salida no es pelear con cada pensamiento. Es saber quién sos y qué dice Dios de vos y de tu futuro. Ahí está la realidad de tu esencia.\n\nMás enseñanzas en YouTube (@adrianencamino) y escritos en elgransueno.org. Link en la bio.\n\n#ElGranSueñoDeDios #ElGranSueño #CristoEnNosotros #CristoMiVida #Identidad #NuevaVida"}, {"id": "b17-tu-alma-aprendio-a-sobrevivir", "titulo": "B17 tu alma aprendio a sobrevivir", "serie": "La guerra en tu mente 17", "ts": "2026-10-20 08:29", "llega": "2026-10-27T19:00", "texto": "El espíritu ya está completo en Cristo. El proceso pasa en el alma.\n\nUn alma que aprendió a sobrevivir desde la caída, a vivir en Adán. Por eso duele: no estás mejorando lo viejo, estás aprendiendo a vivir desde lo nuevo.\n\nEl video completo, La guerra en tu mente, está en YouTube (@adrianencamino).\nEn elgransueno.org conectamos a los que están viviendo el gran sueño de Dios. Link en la bio.\n\n#ElGranSueñoDeDios #ElGranSueño #CristoEnNosotros #CristoMiVida #NuevaVida #Sanidad"}, {"id": "peli-86-nacer", "titulo": "¿Y si lo que necesitás no es mejorar, sino nacer?", "serie": "Películas 86", "ts": "2026-10-25T12:47:24", "llega": "2026-10-27T21:30", "texto": "¿Y si lo que necesitás no es mejorar, sino nacer?\n\nNicodemo era maestro de Israel, sabía las Escrituras de memoria y vino de noche con una pregunta. Jesús no le dio un método: le dijo que hay que nacer de nuevo. Y él, razonando como razonamos todos, preguntó cómo puede un hombre volver a entrar en el vientre de su madre.\n\nEsa es nuestra manera: arreglar lo viejo, esforzarnos más, entender mejor. Pero lo que nace de la carne, carne es. Lo que nace del Espíritu, espíritu es. No se trata de una vida vieja mejorada: es una vida nueva, y esa vida es Cristo en nosotros. Y por si hacía falta decirlo, Dios no vino a juzgarnos: vino a darnos su vida.\n\nSi alguno está en Cristo, nueva criatura es (2 Corintios 5:17).\n\nEste espacio es tuyo: elgransueno.org\n\nMás enseñanzas en YouTube (@adrianencamino) y en elgransueno.org. Link en el perfil.\n\n#ElGranSueñoDeDios #ElGranSueño #CristoEnNosotros #CristoMiVida #NuevaVida #Salvación #LosElegidos"}, {"id": "b18-hay-gigantes-en-tu-tierra", "titulo": "B18 hay gigantes en tu tierra", "serie": "La guerra en tu mente 18", "ts": "2026-10-20 08:34", "llega": "2026-10-28T11:00", "texto": "Como Israel al entrar a la tierra prometida: había promesa y también gigantes.\n\nLa conquista no es esforzarse más. Es creerle a Dios y vivir de acuerdo a lo que Él dijo de vos.\n\nEl video completo, La guerra en tu mente, está en YouTube (@adrianencamino).\nEn elgransueno.org conectamos a los que están viviendo el gran sueño de Dios. Link en la bio.\n\n#ElGranSueñoDeDios #ElGranSueño #CristoEnNosotros #CristoMiVida #Fe #Libertad"}, {"id": "r04-gran-dia", "titulo": "Gran dia", "serie": "Terraza 04", "ts": "2026-10-25 08:32", "llega": "2026-10-28T15:00", "texto": "Todos decimos que va a ser un gran día, pero la pregunta es por qué. Si depende de que todo salga como yo quiero, hoy no hay fundamento.\n\nEl reposo, la alegría y la obediencia de Dios no son cosas: son una persona. Cristo no está separado de los hijos, Él es la vida de los hijos. Hoy es el único día que existe, y Él lo habita.\n\nDecir Cristo es mi vida es más que creer que es mi Salvador.\n\nMás enseñanzas en YouTube (@adrianencamino) y escritos en elgransueno.org. Link en la bio.\n\n#ElGranSueñoDeDios #ElGranSueño #CristoEnNosotros #CristoMiVida #Reposo #VivirElPresente"}, {"id": "b16-ensenale-a-tu-alma-quien-es-el-senor", "titulo": "B16 ensenale a tu alma quien es el senor", "serie": "La guerra en tu mente 16", "ts": "2026-10-20 08:24", "llega": "2026-10-28T19:00", "texto": "Tu alma, tus emociones y tu voluntad son el canal por donde Cristo se expresa.\n\nComo David, le enseñamos al alma a estar tranquila y llevamos cautivo todo pensamiento. No con fuerza propia: desde la mente nueva, desde Cristo en vos.\n\nEl video completo, La guerra en tu mente, está en YouTube (@adrianencamino).\nEn elgransueno.org conectamos a los que están viviendo el gran sueño de Dios. Link en la bio.\n\n#ElGranSueñoDeDios #ElGranSueño #CristoEnNosotros #CristoMiVida #Reposo #MenteNueva"}, {"id": "peli-87-roca", "titulo": "Toda la noche y no pescó nada", "serie": "Películas 87", "ts": "2026-10-25T12:50:53", "llega": "2026-10-28T21:30", "texto": "¿Hace cuánto que tirás la red toda la noche y no sale nada?\n\nSimón es pescador. Pasó la noche entera haciendo lo que sabía hacer, a su manera, con su experiencia, y no sacó nada. Entonces aparece Jesús y le pide que tire una vez más. La red se llena. Y lo primero que Simón dice no es gracias: es aléjate de mí, soy un hombre pecador.\n\nEso nos pasa a nosotros. Vivimos dependiendo de nuestros argumentos, de nuestra forma, de nuestra experiencia, de lo que nos dijeron que había que hacer. Y los resultados no llegan, o no llega lo que la Biblia nos promete, porque no podemos producir eso. Nunca fue nuestro trabajo.\n\nA diferencia de Simón, hoy Cristo está en nosotros. Cuando Dios nos muestra lo que no veíamos, el corazón, las equivocaciones, no hace falta esconderse: es el momento de alinearnos con Él. Y más y más, nuestra vida se va pareciendo a la suya, porque esa vida es Cristo, y esa vida se expresa con resultados, con fruto, con su vida mostrándose en la nuestra.\n\nTodo cambia cuando dejamos de producir y empezamos a depender.\n\nNos escogió en él antes de la fundación del mundo (Efesios 1:4).\n\nEste espacio es tuyo: elgransueno.org\n\nMás enseñanzas en YouTube (@adrianencamino) y en elgransueno.org. Link en el perfil.\n\n#ElGranSueñoDeDios #ElGranSueño #CristoEnNosotros #CristoMiVida #Reposo #NuevaVida #LosElegidos"}, {"id": "b19-vivir-desde-quien-sos-es-una-guerra", "titulo": "B19 vivir desde quien sos es una guerra", "serie": "La guerra en tu mente 19", "ts": "2026-10-20 08:44", "llega": "2026-10-29T11:00", "texto": "Vivir desde tu identidad en Cristo choca con todo: con la carne, con el sistema del mundo, con lo espiritual.\n\nNo te asustes del conflicto. El Dios que está en vos está en comunión constante con el Padre: escucha, habla, discierne. Y te lleva a ser fiel a lo que estás viendo.\n\nEl video completo, La guerra en tu mente, está en YouTube (@adrianencamino).\nEn elgransueno.org conectamos a los que están viviendo el gran sueño de Dios. Link en la bio.\n\n#ElGranSueñoDeDios #ElGranSueño #CristoEnNosotros #CristoMiVida #Libertad #EspírituSanto"}, {"id": "r05-espiritu", "titulo": "Espiritu", "serie": "Terraza 05", "ts": "2026-10-25 08:33", "llega": "2026-10-29T15:00", "texto": "Tomarlo con pasividad es dejar que gobierne el miedo, el temor o lo que dirán. Pero hay otro lugar: el espíritu, la nueva creación, donde siempre estuvo el poder.\n\nAhí hay fuerza para creer, para perseverar y para enfrentar. El alma aprende y se rinde ante ese amo, y la oscuridad se retira cuando te levantás con la identidad y las armas que Dios te dio.\n\nMás enseñanzas en YouTube (@adrianencamino) y escritos en elgransueno.org. Link en la bio.\n\n#ElGranSueñoDeDios #ElGranSueño #CristoEnNosotros #CristoMiVida #Libertad #EspírituSanto"}, {"id": "b20-el-libro-que-nunca-termine-de-leer", "titulo": "B20 el libro que nunca termine de leer", "serie": "La guerra en tu mente 20", "ts": "2026-10-20 10:41", "llega": "2026-10-29T19:00", "texto": "De adolescente me regalaron un libro sobre conocer a Dios. Nunca lo terminé.\n\nHoy entiendo por qué: a Dios no se lo termina de estudiar. Es infinito. Conocerlo no es acumular datos, es perder lo que creíamos saber para que Él viva en nosotros.\n\nEl video completo, La guerra en tu mente, está en YouTube (@adrianencamino).\nEn elgransueno.org conectamos a los que están viviendo el gran sueño de Dios. Link en la bio.\n\n#ElGranSueñoDeDios #ElGranSueño #CristoEnNosotros #CristoMiVida #Luz #Revelación"}, {"id": "peli-91-esperanza", "titulo": "La esperanza no se logra cavando solos", "serie": "Películas 91", "ts": "2026-10-25T16:00:23", "llega": "2026-10-29T21:30", "texto": "¿Cuánto tiempo llevás cavando solo?\n\nAndy pasó años construyendo su salida con sus propias manos. Cuando por fin está afuera, lo primero que hace es dejarle una carta a su amigo: la esperanza es una buena cosa, tal vez la mejor de las cosas, y ninguna cosa buena muere.\n\nA nosotros nos pasa. Intentamos, probamos, peleamos, hasta que la luz aparece por donde no esperábamos. No era cavar más: era creerle a Quien ya abrió la salida. La esperanza no es un deseo ni un esfuerzo. Es una Persona, y esa Persona vive en nosotros.\n\nSi el Hijo os libertare, seréis verdaderamente libres (Juan 8:36).\n\nEste espacio es tuyo: elgransueno.org\n\nMás enseñanzas en YouTube (@adrianencamino) y en elgransueno.org. Link en el perfil.\n\n#ElGranSueñoDeDios #ElGranSueño #CristoEnNosotros #CristoMiVida #Esperanza #Libertad #Shawshank"}, {"id": "b21-el-espiritu-trabaja-dia-y-noche", "titulo": "B21 el espiritu trabaja dia y noche", "serie": "La guerra en tu mente 21", "ts": "2026-10-20 10:53", "llega": "2026-10-30T11:00", "texto": "Conocer a Dios no pasa por leer más o escuchar más. Es discernir, recibir entendimiento, ver a Cristo en vos.\n\nY lo que trae descanso es esto: si le entregaste tu vida, su Espíritu está trabajando día y noche para que Él sea el todo. No lo tenés que sostener vos.\n\nEl video completo, La guerra en tu mente, está en YouTube (@adrianencamino).\nEn elgransueno.org conectamos a los que están viviendo el gran sueño de Dios. Link en la bio.\n\n#ElGranSueñoDeDios #ElGranSueño #CristoEnNosotros #CristoMiVida #Reposo #EspírituSanto"}, {"id": "r06-tormenta", "titulo": "Tormenta", "serie": "Terraza 06", "ts": "2026-10-25 08:33", "llega": "2026-10-30T15:00", "texto": "La vida te regala oportunidades todos los días, aunque las llames injusticia o crueldad: oportunidades para vivir desde tu esencia y no desde el ego, las carencias o la justicia propia.\n\nHabrá un conflicto interno importante, porque el cielo necesita mostrarte dónde estás fundamentado. Todo lo que pediste está pasando, y la tormenta es parte del camino.\n\nMás enseñanzas en YouTube (@adrianencamino) y escritos en elgransueno.org. Link en la bio.\n\n#ElGranSueñoDeDios #ElGranSueño #CristoEnNosotros #CristoMiVida #Plenitud #NuevaVida"}, {"id": "r23-el-quiebre-es-la-rendicion", "titulo": "El quiebre es la rendicion", "serie": "Terraza 23", "ts": "2026-10-09 10:46", "llega": "2026-10-30T19:00", "texto": "¿Dónde está el quiebre total?\n\nEl quiebre total es cuando hay una rendición total. Me animo a todo hasta el fin. Me entrego por total. Estoy dispuesto a que mi existencia, mi vida, la entrego a Dios para que Él haga lo que quiera.\n\nA todo lugar donde Él quiera, yo estoy dispuesto.\n\nNo hay otra forma de caminar con Dios. Es rendición total. Solamente que es un proceso de día a día, de tomar tu cruz.\n\nMás en elgransueno.org\n\n#elgransueno #Cristo #vidanueva #descanso #identidadenCristo"}, {"id": "peli-92-maximo", "titulo": "¿Quién sos cuando te sacan todo?", "serie": "Películas 92", "ts": "2026-10-25T16:05:26", "llega": "2026-10-30T21:30", "texto": "¿Quién sos cuando te sacan todo?\n\nLe preguntan su nombre y primero dice Gladiador. Después dice todo lo que fue: comandante, general, padre, marido. Todo lo que tenía y todo lo que perdió. Y lo único que le queda es la venganza.\n\nMuchas veces respondemos igual: con lo que hicimos, con los títulos, con lo que nos pasó. Pero tu nombre no está en lo que fuiste ni en lo que perdiste. Está en lo que Dios dice de vos, y lo dijo hace mucho: mío eres tú.\n\nNo te definen tus títulos ni tu dolor. Te define Quien te llamó.\n\nTe puse nombre, mío eres tú (Isaías 43:1).\n\nEste espacio es tuyo: elgransueno.org\n\nMás enseñanzas en YouTube (@adrianencamino) y en elgransueno.org. Link en el perfil.\n\n#ElGranSueñoDeDios #ElGranSueño #CristoEnNosotros #CristoMiVida #Identidad #NuevaVida #Gladiador"}, {"id": "r24-no-cuenta-nuestra-infidelidad", "titulo": "No cuenta nuestra infidelidad", "serie": "Terraza 24", "ts": "2026-10-09 10:46", "llega": "2026-10-31T11:00", "texto": "El que está haciendo la obra en vos es Dios. A través de circunstancias, de ambientes, de palabras.\n\nA medida que hay madurez, a medida que caminamos, hay un acuerdo mayor, hay una perseverancia mayor.\n\nY gracias a Dios que no cuenta nuestra infidelidad, sino la fidelidad de Él. Cuenta su obra eterna, su vida eterna en vos.\n\nEso es lo que permite que te caigas y te levantes quinientas veces. Lo que permite que aprendas de cada error. Lo que permite que perseveres.\n\nMás en elgransueno.org\n\n#elgransueno #Cristo #vidanueva #descanso #identidadenCristo"}, {"id": "r07-engano", "titulo": "Engano", "serie": "Terraza 07", "ts": "2026-10-25 08:34", "llega": "2026-10-31T15:00", "texto": "Jesús vio a Natanael antes de que se acercara y lo llamó un verdadero israelita, sin engaño (Juan 1:47). Se sintió conocido por completo.\n\nEl engaño no empieza cuando engañamos al mundo. Empieza cuando nos engañamos a nosotros mismos, cuando le mentimos a la conciencia. Es la mentalidad humana que quiere controlar y unir todos los puntos, pero tenemos una conciencia donde Dios nos habla.\n\nMás enseñanzas en YouTube (@adrianencamino) y escritos en elgransueno.org. Link en la bio.\n\n#ElGranSueñoDeDios #ElGranSueño #CristoEnNosotros #CristoMiVida #Luz #Verdad"}, {"id": "r25-perseverar-no-es-facil", "titulo": "Perseverar no es facil", "serie": "Terraza 25", "ts": "2026-10-09 10:46", "llega": "2026-10-31T19:00", "texto": "Ese es mi verdadero discípulo.\n\nQuiero que veas la palabra de Dios no como algo que aprendiste, no como algo que te dijeron, sino como una revelación. Como una verdad que Dios te habló.\n\nY la perseverancia no es nada fácil. Es un proceso duro, de muerte, de dolor. Me gusta la imagen de la semilla que se cae y muere. Que se cae y echa raíces profundas.\n\nConocerán la verdad, y la verdad los hará libres. El conocer la verdad que te rompe la mentira está en la perseverancia.\n\nMás en elgransueno.org\n\n#elgransueno #Cristo #vidanueva #descanso #identidadenCristo"}, {"id": "peli-93-dormammu", "titulo": "¿Quién se cansa primero?", "serie": "Películas 93", "ts": "2026-10-25T16:09:23", "llega": "2026-10-31T21:30", "texto": "¿Quién se cansa primero?\n\nDoctor Strange muere una y otra vez frente a Dormammu, y cada vez vuelve a decir lo mismo: he venido a negociar. No gana peleando más fuerte. Gana quedándose, hasta que el otro entiende que no puede con él.\n\nPeleamos tanto por ganar algo que ya está ganado. La culpa insiste, el miedo insiste, el cansancio insiste. Pero Cristo ya triunfó. No peleamos para vencer: permanecemos en Quien venció. Ese es el descanso.\n\nDespojó a los principados y a las potestades, triunfando sobre ellos en la cruz (Colosenses 2:15).\n\nEste espacio es tuyo: elgransueno.org\n\nMás enseñanzas en YouTube (@adrianencamino) y en elgransueno.org. Link en el perfil.\n\n#ElGranSueñoDeDios #ElGranSueño #CristoEnNosotros #CristoMiVida #Reposo #Victoria #DoctorStrange"}, {"id": "r26-no-seas-el-protagonista", "titulo": "No seas el protagonista", "serie": "Terraza 26", "ts": "2026-10-09 10:46", "llega": "2026-11-01T11:00", "texto": "Este es un camino de pérdida del control. De pérdida del sistema en el que naciste y conocés, para empezar a conocer la vida nueva.\n\nAmigos, relajémonos. Aprendamos a no ser el protagonista, a no querer hacerlo todo.\n\nNuestro valor no está en lo que hacés. No está en lo que sabés. No está en con quién estás. No está en lo que tenés.\n\nNuestro valor está en lo único que tiene valor, que es Cristo. Por eso Pablo dice: Cristo en nosotros, esperanza de gloria.\n\nMás en elgransueno.org\n\n#elgransueno #Cristo #vidanueva #descanso #identidadenCristo"}, {"id": "r08-radical", "titulo": "Radical", "serie": "Terraza 08", "ts": "2026-10-25 08:35", "llega": "2026-11-01T15:00", "texto": "Radical significa raíz, fundamento, origen. Ir a lo primero y no quedarse en lo superficial.\n\nVivir la fe así es creerle a Dios y caminar hacia lo que Él dijo y hizo, aunque no lo sientas ni lo veas. Eso trae una transformación: tu verdadera identidad se manifiesta, y Dios, nuestra vida, se expresa.\n\nMás enseñanzas en YouTube (@adrianencamino) y escritos en elgransueno.org. Link en la bio.\n\n#ElGranSueñoDeDios #ElGranSueño #CristoEnNosotros #CristoMiVida #Identidad #NuevaVida"}, {"id": "r27-la-muralla", "titulo": "La muralla", "serie": "Terraza 27", "ts": "2026-10-09 10:46", "llega": "2026-11-01T19:00", "texto": "Imaginate que toda la vida fuiste un esclavo y ni lo sabías. Y de repente viste que había una muralla más allá.\n\nY se abrió. Llamemos a eso gracia. Se abrió la muralla y saliste.\n\nTodo era diferente. No operan las reglas que operaban dentro de la muralla.\n\nY tenés tanto espacio para recorrer y tanta realidad que vivir, que no sabés cómo hacer.\n\nMás en elgransueno.org\n\n#elgransueno #Cristo #vidanueva #descanso #identidadenCristo"}, {"id": "peli-95-sam", "titulo": "Cuando ya no queda salida, amanece", "serie": "Películas 95", "ts": "2026-10-25T16:13:08", "llega": "2026-11-01T21:30", "texto": "¿Cuántas noches más esperamos sin ver salida?\n\nEl Abismo de Helm está perdido. No queda salida ni queda tiempo. Y alguien dice: salga conmigo, el sol ya está saliendo. Hay una promesa: al quinto día, al amanecer, vigila el oriente.\n\nA veces la noche se alarga hasta que ya no queda nada que podamos hacer nosotros. Y ahí, justo ahí, empieza lo que Él hace. La esperanza no depende de cuánto aguantemos: depende de que amanece. Mirá al oriente.\n\nPor la mañana vendrá la alegría (Salmo 30:5).\n\nEste espacio es tuyo: elgransueno.org\n\nMás enseñanzas en YouTube (@adrianencamino) y en elgransueno.org. Link en el perfil.\n\n#ElGranSueñoDeDios #ElGranSueño #CristoEnNosotros #CristoMiVida #Esperanza #Luz #ElSeñorDeLosAnillos"}, {"id": "r28-vivimos-dentro-de-murallas", "titulo": "Vivimos dentro de murallas", "serie": "Terraza 28", "ts": "2026-10-09 10:46", "llega": "2026-11-02T11:00", "texto": "Muchas veces vivimos en esta realidad de muralla. ¿Y cómo sabés si vivís en murallas? Algo que no te deja avanzar, una realidad que no podés ver, pero ahí está.\n\nNo hablo de las limitaciones reales que tenemos como humanidad, la fragilidad. Hablo de todo lo que opera en Adán.\n\nMiedo, y por lo tanto vamos al control. Insatisfacción, que no sabés ni por qué pero está ahí adentro. Falta de libertad en mil cosas.\n\nCulpa. Y no una culpa porque ayer hiciste lo que no querías hacer. Una culpa mucho más profunda, por cosas que pesan. El lugar donde estás, de dónde venís, qué tenés, qué no tenés. Vergüenza. Y otras características de este sistema operativo.\n\nMás en elgransueno.org\n\n#elgransueno #Cristo #vidanueva #descanso #identidadenCristo"}, {"id": "l01-espiritu-completo", "titulo": "L01 espiritu completo", "serie": "Ten misericordia", "ts": "2026-10-25 08:36", "llega": "2026-11-02T15:00", "texto": "Caminar en el Espíritu es un proceso diario: reconocer lo que Dios muestra y pasar por encima de la vieja creación, como Jesús sobrepasó la vergüenza hasta la cruz.\n\nEs andar en la palabra, permanecer en lo que Dios te enseñó y vencer lo que sabés que no es Cristo. La verdad que nos hace libres (Juan 8:32) es para que Cristo, nuestra vida, se mueva y se exprese, y puedas experimentar el río de agua viva (Juan 7:38).\n\nMás enseñanzas en YouTube (@adrianencamino) y escritos en elgransueno.org. Link en la bio.\n\n#ElGranSueñoDeDios #ElGranSueño #CristoEnNosotros #CristoMiVida #Libertad #EspírituSanto #NuevaVida"}, {"id": "r29-no-sabemos-vivir-en-libertad", "titulo": "No sabemos vivir en libertad", "serie": "Terraza 29", "ts": "2026-10-09 10:46", "llega": "2026-11-02T19:00", "texto": "De repente, en Cristo como vida, empezamos a conocer. Empezamos a perseverar en Él. Un camino de tomar tu cruz, claro que sí. Pero empezás a ver más.\n\nY cuando descubrimos lo que es la libertad, no sabemos andar en ella.\n\n¿Ahora qué? Sos libre. Mi valor está en Cristo, no cambia por lo que hacés ni por lo que no hacés.\n\n¿Ahora qué? ¿Podés crear lo que quieras? Claro.\n\nMás en elgransueno.org\n\n#elgransueno #Cristo #vidanueva #descanso #identidadenCristo"}, {"id": "peli-96-vuelo", "titulo": "¿Por qué me siento tan diferente?", "serie": "Películas 96", "ts": "2026-10-25T16:17:51", "llega": "2026-11-02T21:30", "texto": "¿Y si lo que te hace sentir distinto es de dónde venís?\n\nDesde chico se pregunta por qué es tan diferente a los demás. Su padre le responde: el sol de aquí te hizo más fuerte de lo que imaginé, vas a darle a la gente un ideal al que aspirar, te seguirán, tropezarán y fracasarán, y con el tiempo se unirán a vos en el sol.\n\nTodos sentimos alguna vez que no encajamos. No es un defecto: es origen. Somos de Dios, y Cristo en nosotros es ese ideal que otros ven aunque no sepan nombrarlo. No se trata de ser mejores: se trata de mostrarlo a Él.\n\nVosotros sois linaje escogido, pueblo adquirido por Dios (1 Pedro 2:9).\n\nEste espacio es tuyo: elgransueno.org\n\nMás enseñanzas en YouTube (@adrianencamino) y en elgransueno.org. Link en el perfil.\n\n#ElGranSueñoDeDios #ElGranSueño #CristoEnNosotros #CristoMiVida #Identidad #NuevaVida #HombreDeAcero"}, {"id": "r30-no-es-que-haces-sino-desde-donde", "titulo": "No es que haces sino desde donde", "serie": "Terraza 30", "ts": "2026-10-09 10:46", "llega": "2026-11-03T11:00", "texto": "Aprendimos muy bien a imitar a este Jesús. Tenemos una imagen de cómo es Jesús y por lo tanto imitamos lo que es Él.\n\n¿Pero sabés que todo lo que no nace de Él es muerte? Todo lo que no nace de esa vida nueva es nada. Es la carne intentando reproducir lo que no puede, crear lo que no puede.\n\nPor eso el hombre lucha y lucha y lucha.\n\nPero la Biblia te muestra muy bien qué pasa con las dos realidades. No es qué es lo que hagas. Es desde dónde, o quién es el que está viviendo.\n\nMás en elgransueno.org\n\n#elgransueno #Cristo #vidanueva #descanso #identidadenCristo"}, {"id": "r09-adamico", "titulo": "Adamico", "serie": "Terraza 09", "ts": "2026-10-25 08:36", "llega": "2026-11-03T15:00", "texto": "Cuando la vieja naturaleza te habla con su lista, no es tu identidad: es lo que vino a morir en la cruz.\n\nAunque no lo veas ni lo sientas, en vos habita la realidad de Dios por medio del Espíritu. Empezar por la fe es enseñarle al alma lo que ya es verdad, y eso trae resultados.\n\nMás enseñanzas en YouTube (@adrianencamino) y escritos en elgransueno.org. Link en la bio.\n\n#ElGranSueñoDeDios #ElGranSueño #CristoEnNosotros #CristoMiVida #NuevaVida #Libertad"}, {"id": "r31-ten-misericordia-de-mi", "titulo": "Ten misericordia de mi", "serie": "Terraza 31", "ts": "2026-10-09 10:46", "llega": "2026-11-03T19:00", "texto": "La mejor frase que describe esto es una que voy a compartir.\n\nSeñor Jesús, ten misericordia de mí.\n\nPorque cuando yo me veo, cuando veo la realidad de lo que no veo, cuando veo la realidad de lo que sí veo, clamo.\n\n¿Y por qué soy capaz de clamar? Porque he conocido un poco más de la santidad de Dios, un poco más de la realidad espiritual. Y en esa realidad lo único que es mi salvación es Cristo.\n\nAunque Él se haya dado por completo, podemos seguir dejando al costado al que es la única vida. Y no es un Dios lejano. Es un Dios cercano, presente ahora.\n\nMás en elgransueno.org\n\n#elgransueno #Cristo #vidanueva #descanso #identidadenCristo"}, {"id": "r32-ama-y-haz-lo-que-quieras", "titulo": "Ama y haz lo que quieras", "serie": "Terraza 32", "ts": "2026-10-09 10:46", "llega": "2026-11-04T11:00", "texto": "Escuché una frase de San Agustín: ama y haz lo que quieras.\n\nEse hacer lo que quieras tiene que ver con la libertad. Con tu pasión. Con estar conectado. Con lo que Pablo dice: sean libres, pero no usen esa libertad para lo que no es su identidad, no usen su libertad para la carne.\n\nY hay una realidad muy fuerte. No sabemos vivir en libertad. Y estamos aprendiendo.\n\nVivir en libertad es vivir desde la realidad de Cristo en vos. Es vivir desde esa nueva vida. Y esa nueva vida hay que conocerla.\n\nMás en elgransueno.org\n\n#elgransueno #Cristo #vidanueva #descanso #identidadenCristo"}, {"id": "r10-cruz", "titulo": "Cruz", "serie": "Terraza 10", "ts": "2026-10-25 08:37", "llega": "2026-11-04T15:00", "texto": "No hay camino del Espíritu sin cruz. Jesús sobrepasó la vergüenza porque sabía adónde iba (Hebreos 12:2).\n\nCada día, reconocer lo que Dios muestra y pasar por encima de Adán es construir en la palabra: en lo que sabés que es correcto.\n\nMás enseñanzas en YouTube (@adrianencamino) y escritos en elgransueno.org. Link en la bio.\n\n#ElGranSueñoDeDios #ElGranSueño #CristoEnNosotros #CristoMiVida #NuevaVida #Libertad"}, {"id": "r33-que-significa-amar", "titulo": "Que significa amar", "serie": "Terraza 33", "ts": "2026-10-09 10:46", "llega": "2026-11-04T19:00", "texto": "¿Qué significa amar en este proceso?\n\nEl amor no es algo que yo pueda hacer a mi manera. El amor es Dios. Él es el que puede ser expresado.\n\nNosotros llamamos amor a todo: al egoísmo, a querer a los que me hacen bien. Todo eso es la carne tratando de responder.\n\nPor eso lo verdadero es amá a tus enemigos, bendecí a los que te persiguen. ¿Cómo es posible? Mediante la expresión del amor, Cristo en vos.\n\nEntonces amá. Que Cristo sea tu vida, que Él sea expresado. Y si esto sucede, hacé lo que quieras. Hacé aquello que te apasiona, porque vas a vivir desde el amor.\n\nMás en elgransueno.org\n\n#elgransueno #Cristo #vidanueva #descanso #identidadenCristo"}, {"id": "r34-amar-tambien-es-morir", "titulo": "Amar tambien es morir", "serie": "Terraza 34", "ts": "2026-10-09 10:46", "llega": "2026-11-05T11:00", "texto": "El amar, por cierto, es un proceso de muerte.\n\nEs un proceso de muerte porque la carne no quiere saber de amar. La carne no sabe amar.\n\nPero somos llamados a tomar nuestra cruz y permitir que nuestra alma responda a la realidad de Cristo. Que nuestra alma vaya a toda la obediencia.\n\nPara que nuestra característica, cómo Dios nos hizo, responda a Dios. Para que seamos verdadera expresión de lo único que Dios llama vida, y a lo que hemos sido trasladados.\n\nMás en elgransueno.org\n\n#elgransueno #Cristo #vidanueva #descanso #identidadenCristo"}, {"id": "r11-libres", "titulo": "Libres", "serie": "Terraza 11", "ts": "2026-10-25 08:37", "llega": "2026-11-05T15:00", "texto": "Juan 8:32. La libertad no es solo para vos. Es para que Cristo, nuestra vida, se mueva libremente y se exprese a través tuyo.\n\nPerseverar en su palabra, en su realidad y en lo que Él hizo trae una libertad que rompe todo engaño, manipulación y control. Y deja correr el río de agua viva.\n\nMás enseñanzas en YouTube (@adrianencamino) y escritos en elgransueno.org. Link en la bio.\n\n#ElGranSueñoDeDios #ElGranSueño #CristoEnNosotros #CristoMiVida #Libertad #Plenitud"}, {"id": "c02-elegido", "titulo": "C02 elegido", "serie": "China en Tirana 02", "ts": "2026-10-25 08:38", "llega": "2026-11-05T19:00", "texto": "Hay una palabra más potente que tus pensamientos: la de Aquel que vino e hizo lo suficiente. Los miedos no se van solos; tomarte en serio es pararte de frente y recordarlo.\n\nVolver a empezar es salir del lugar donde todos piensan lo mismo, porque vos fuiste llamado.\n\nMás enseñanzas en YouTube (@adrianencamino) y escritos en elgransueno.org. Link en la bio.\n\n#ElGranSueñoDeDios #ElGranSueño #CristoEnNosotros #CristoMiVida #Identidad #NuevaVida"}, {"id": "r01-mayordomo-alma-espiritu", "titulo": "Mayordomo alma espiritu", "serie": "Terraza 01", "ts": "2026-10-25 21:01", "llega": "2026-11-06T11:00", "texto": "Cuando uno se pregunta quién manda adentro, casi siempre responde con la cabeza. Pero la mente también es alma, igual que lo que sentimos y lo que decidimos, y el alma lleva demasiado tiempo acostumbrada a vivir sola.\n\nLo dije en un café de Italia, con un micrófono en la mano, en un video de casi 43 minutos donde sigo preguntándome por qué a veces sentimos que no hay sentido. Si estás atravesando algo que no entendés, quizás no sea un problema. Puede ser un proceso en el interior que todavía no ves entero.\n\nEl video completo, Café reflexión, está en mi canal de YouTube. Y hay escritos en elgransueno.org\n\n#ElGranSueñoDeDios #ElGranSueño #CristoEnNosotros #CristoMiVida #NuevaVida #Reposo #Libertad"}, {"id": "r02-creer-no-es-vivir", "titulo": "Creer no es vivir", "serie": "Terraza 02", "ts": "2026-10-25 21:02", "llega": "2026-11-06T15:00", "texto": "Hay una distancia enorme entre saber algo de vos y vivirlo. Podés tener claro que valés, y aun así pasar años buscando agradar a quien no te cuida.\n\nEn el video largo llamé conciencia a eso que no es un dato sino algo que viste de verdad, y lo que se ve cambia cómo vivís. Si hoy estás sufriendo, quizás no te falte esfuerzo. Quizás te falte ver, y ver es un regalo, no un logro.\n\nEl video completo, Café reflexión, está en mi canal de YouTube. Y hay escritos en elgransueno.org\n\n#ElGranSueñoDeDios #ElGranSueño #CristoEnNosotros #CristoMiVida #Libertad #Identidad #Plenitud"}, {"id": "r03-cruz-y-perdon", "titulo": "Cruz y perdon", "serie": "Terraza 03", "ts": "2026-10-25 21:02", "llega": "2026-11-06T19:00", "texto": "La cruz es de las palabras que más repetimos y menos miramos. En este tramo del video largo me quedé en una sola pregunta: qué estoy llamado a pasar por encima. Y el ejemplo más difícil que encontré fue el perdón, que no se vive entendiéndolo sino caminándolo, aunque tu carne se resista.\n\nNo se trata de rendir más. Se trata de rendirse, para que Él se exprese.\n\nEl video completo, Café reflexión, está en mi canal de YouTube. Y hay escritos en elgransueno.org\n\n#ElGranSueñoDeDios #ElGranSueño #CristoEnNosotros #CristoMiVida #Libertad #NuevaVida #Reposo"}, {"id": "r04-natanael-sin-engano", "titulo": "Natanael sin engano", "serie": "Terraza 04", "ts": "2026-10-25 21:03", "llega": "2026-11-07T11:00", "texto": "Hay una escena en el Evangelio de Juan donde alguien descubre que fue visto antes de buscar. Me vino a la mente en el café, justo cuando no encontraba otra palabra que coherencia.\n\nQuizás hoy te sientas lejos, o a medias, o con más preguntas que fe. Dios no espera que te completes: sale al encuentro de quien decide vivir en verdad, aunque sea un poquito. Lo que viene antes y después de esta escena está en el video completo.\n\nEl video completo, Café reflexión, está en mi canal de YouTube. Y hay escritos en elgransueno.org\n\n#ElGranSueñoDeDios #ElGranSueño #CristoEnNosotros #CristoMiVida #Luz #NuevaVida #Identidad"}, {"id": "r11-que-quiso-decir-jesus", "titulo": "Que quiso decir jesus", "serie": "Terraza 11", "ts": "2026-10-25 21:03", "llega": "2026-11-07T15:00", "texto": "Muchas veces leemos una frase de Jesús y seguimos de largo. De esta, lo que más me sacudió no fue lo que dijo sino lo que implica: que existe una forma de vivir donde no te escondés de Dios ni de vos.\n\nLa fui armando mientras hablaba de coherencia, y por eso este recorte se queda con ella. El camino completo hasta acá, con todo lo que la rodea, está en el video largo.\n\nEl video completo, Café reflexión, está en mi canal de YouTube. Y hay escritos en elgransueno.org\n\n#ElGranSueñoDeDios #ElGranSueño #CristoEnNosotros #CristoMiVida #Luz #Libertad #Coherencia"}, {"id": "r05-morir-no-parecerse", "titulo": "Morir no parecerse", "serie": "Terraza 05", "ts": "2026-10-25 21:03", "llega": "2026-11-07T19:00", "texto": "¿Quién no quiere ser como Cristo? El problema empieza cuando intentamos lograrlo desde el alma que aprende de memoria.\n\nEste tramo cierra una idea que vengo hilando en el video largo: la vida que recibimos se expresa, no se imita. Y en el medio hay una imagen de las estaciones y de una planta echando raíces que la explica mejor que yo.\n\nEl video completo, Café reflexión, está en mi canal de YouTube. Y hay escritos en elgransueno.org\n\n#ElGranSueñoDeDios #ElGranSueño #CristoEnNosotros #CristoMiVida #NuevaVida #Plenitud #Salvación"}, {"id": "r06-cambiar-es-morir", "titulo": "Cambiar es morir", "serie": "Terraza 06", "ts": "2026-10-25 21:03", "llega": "2026-11-08T11:00", "texto": "Cuando alguien te dice que cambies, ¿te pide un hábito o te pide a vos? Lo pensé al acordarme de un psicólogo famoso y de la Biblia hablando de imitar, de amar, de morir.\n\nY descubrí algo hermoso: decirle Señor, no puedo, no es el final de nada. Es el lugar donde Él empieza. El resto de esta idea, con el recorrido completo, está en el video de café.\n\nEl video completo, Café reflexión, está en mi canal de YouTube. Y hay escritos en elgransueno.org\n\n#ElGranSueñoDeDios #ElGranSueño #CristoEnNosotros #CristoMiVida #Libertad #NuevaVida #Reposo"}, {"id": "r07-miedo-control", "titulo": "Miedo control", "serie": "Terraza 07", "ts": "2026-10-25 21:03", "llega": "2026-11-08T15:00", "texto": "El miedo se disfraza muy bien. A veces de prudencia, a veces de responsabilidad, a veces de espiritualidad.\n\nEn el video largo lo dije en medio de una lista de cosas con las que viene cargada el alma: estructuras, miedos, creencias. Y también dije lo que más me consuela: que hay Alguien que ya nos hizo libres, y que vivir esa libertad es un proceso, no una prueba.\n\nEl video completo, Café reflexión, está en mi canal de YouTube. Y hay escritos en elgransueno.org\n\n#ElGranSueñoDeDios #ElGranSueño #CristoEnNosotros #CristoMiVida #Libertad #Reposo #Plenitud"}, {"id": "r12-libre-por-la-cruz-viviendo-libertad", "titulo": "Libre por la cruz viviendo libertad", "serie": "Terraza 12", "ts": "2026-10-25 21:04", "llega": "2026-11-08T19:00", "texto": "Hay verdades que sabemos de memoria y todavía no habitamos. Esta es una de ellas, y la dije en el café sin darme cuenta de cuánto me la estaba diciendo a mí.\n\nSi algo de esto te hace ruido, quedate: no es un castigo, es el comienzo del fruto. La idea completa, desde antes del miedo hasta lo que sigue, está en el video largo.\n\nEl video completo, Café reflexión, está en mi canal de YouTube. Y hay escritos en elgransueno.org\n\n#ElGranSueñoDeDios #ElGranSueño #CristoEnNosotros #CristoMiVida #Libertad #NuevaVida #Plenitud"}, {"id": "r08-espiritu-a-espiritu", "titulo": "Espiritu a espiritu", "serie": "Terraza 08", "ts": "2026-10-25 21:04", "llega": "2026-11-09T11:00", "texto": "Después de más de media hora, cuando ya había dicho que quizás algunos entienden muy poquito, me salió esto: hay palabras que no se explican, se tocan.\n\nLo dije para quien siente ruido pero no comprende. No pasa nada. No es cuestión de mente: es de espíritu a espíritu, y Dios habla ese idioma. Todo lo que viene antes de este momento está en el video completo.\n\nEl video completo, Café reflexión, está en mi canal de YouTube. Y hay escritos en elgransueno.org\n\n#ElGranSueñoDeDios #ElGranSueño #CristoEnNosotros #CristoMiVida #EspírituSanto #Luz #NuevaVida"}, {"id": "r09-camino-sombra-coherencia", "titulo": "Camino sombra coherencia", "serie": "Terraza 09", "ts": "2026-10-25 21:04", "llega": "2026-11-09T15:00", "texto": "Hace poco caminé mil kilómetros. No lo digo en contra del camino, al contrario. Lo digo porque en este video largo, sentado en un café, entendí por qué la sombra se parece tanto a lo real y no lo es.\n\nY por qué, aunque sintamos que ya no podemos más, ahí empieza la obra de Él. Seguí el hilo completo en mi canal.\n\nEl video completo, Café reflexión, está en mi canal de YouTube. Y hay escritos en elgransueno.org\n\n#ElGranSueñoDeDios #ElGranSueño #CristoEnNosotros #CristoMiVida #Luz #NuevaVida #Coherencia"}, {"id": "r10-cachetada-sin-condenacion", "titulo": "Cachetada sin condenacion", "serie": "Terraza 10", "ts": "2026-10-25 21:05", "llega": "2026-11-09T19:00", "texto": "Es la parte más personal de todo el video, y casi la dejo afuera.\n\nSi alguna vez te equivocaste feo y la vergüenza te dijo quién sos, esto es para vos. Hay dolor de arrepentimiento y hay culpa, y no son lo mismo. Lo que sigue en el video, y lo que pasó después, está en la versión completa.\n\nEl video completo, Café reflexión, está en mi canal de YouTube. Y hay escritos en elgransueno.org\n\n#ElGranSueñoDeDios #ElGranSueño #CristoEnNosotros #CristoMiVida #Libertad #Responsabilidad #NuevaVida"}, {"id": "r13-libertad-condicionado", "titulo": "Libertad condicionado", "serie": "Terraza 13", "ts": "2026-10-25 22:05", "llega": "2026-11-10T11:00", "texto": "Esta idea aparece en el video largo justo después de hablar del árbol del bien y del mal y del diseño con el que fuimos creados. La libertad no nace de que no existan límites, sino de que haya algo que valga la pena elegir.\n\nSi alguna vez sentiste que creer es una jaula, mirá el recorrido completo: lo que sigue cambia la pregunta.\n\nEl video completo, Café reflexión, está en mi canal de YouTube. Y hay escritos en elgransueno.org\n\n#ElGranSueñoDeDios #ElGranSueño #CristoEnNosotros #CristoMiVida #Libertad #Plenitud #NuevaVida"}, {"id": "r14-conciencia-vida-continua", "titulo": "Conciencia vida continua", "serie": "Terraza 14", "ts": "2026-10-25 22:06", "llega": "2026-11-10T15:00", "texto": "La palabra conciencia se volvió central para mí en este último tiempo. No como concepto: como algo que Dios me fue mostrando de a poco y que cambió cómo leo todo lo que vivo.\n\nEn el video largo la sigo hasta lo que hace con el miedo, con la cruz y con las reacciones del día a día.\n\nEl video completo, Café reflexión, está en mi canal de YouTube. Y hay escritos en elgransueno.org\n\n#ElGranSueñoDeDios #ElGranSueño #CristoEnNosotros #CristoMiVida #Luz #NuevaVida #Plenitud"}, {"id": "r15-cuidar-la-conciencia", "titulo": "Cuidar la conciencia", "serie": "Terraza 15", "ts": "2026-10-25 22:06", "llega": "2026-11-10T19:00", "texto": "Cuidar el corazón suena a consejo viejo. Pero detrás hay algo que me costó entender: ahí es donde Dios nos habla, y lo que hagamos con lo que ya nos mostró decide si esa luz crece o se apaga.\n\nEs el segundo tramo de la idea de conciencia como vida continua. El primero y todo lo que viene después están en el video completo, en mi canal.\n\nEl video completo, Café reflexión, está en mi canal de YouTube. Y hay escritos en elgransueno.org\n\n#ElGranSueñoDeDios #ElGranSueño #CristoEnNosotros #CristoMiVida #Luz #Reposo #NuevaVida"}, {"id": "r16-falta-de-sentido-plano-completo", "titulo": "Falta de sentido plano completo", "serie": "Terraza 16", "ts": "2026-10-25 22:06", "llega": "2026-11-11T11:00", "texto": "Hay temporadas en que nada cierra. Lo dije para quien camina en coherencia y aun así siente que no ve el plano completo.\n\nNo es falta de fe. Es parte del camino, y en el video largo sigo con qué significa de verdad ver. Si hoy estás en un tiempo de preguntas o de desierto, pasá por ahí.\n\nEl video completo, Café reflexión, está en mi canal de YouTube. Y hay escritos en elgransueno.org\n\n#ElGranSueñoDeDios #ElGranSueño #CristoEnNosotros #CristoMiVida #Reposo #Plenitud #NuevaVida"}, {"id": "r17-que-significa-ver", "titulo": "Que significa ver", "serie": "Terraza 17", "ts": "2026-10-25 22:07", "llega": "2026-11-11T15:00", "texto": "Después de hablar de lo que no vemos, me detuve a explicar qué quiere decir ver. Es el punto donde todo lo que viene después en el video, la creación, la libertad, la cruz, empieza a acomodarse.\n\nSi solo mirás este fragmento, es una idea. Con el recorrido completo, es una puerta.\n\nEl video completo, Café reflexión, está en mi canal de YouTube. Y hay escritos en elgransueno.org\n\n#ElGranSueñoDeDios #ElGranSueño #CristoEnNosotros #CristoMiVida #Luz #NuevaVida #Plenitud"}, {"id": "r18-hoy-volvi-a-reaccionar", "titulo": "Hoy volvi a reaccionar", "serie": "Terraza 18", "ts": "2026-10-25 22:07", "llega": "2026-11-11T19:00", "texto": "Esto pasó el mismo día que grabé el video, en el centro de refugiados donde ayudo, y lo conté sin maquillarlo. Para mí es una de las claves del mensaje: la conciencia no se nota en los grandes momentos, se nota cuando algo pequeño nos quita la paz y lo vemos rápido.\n\nLo que viene antes, la semana que me llevó hasta acá, está en el video completo.\n\nEl video completo, Café reflexión, está en mi canal de YouTube. Y hay escritos en elgransueno.org\n\n#ElGranSueñoDeDios #ElGranSueño #CristoEnNosotros #CristoMiVida #Libertad #Responsabilidad #NuevaVida"}, {"id": "r19-alma-aprende-a-amar", "titulo": "Alma aprende a amar", "serie": "Terraza 19", "ts": "2026-10-25 22:07", "llega": "2026-11-12T11:00", "texto": "Entre la creación, la cruz y los gigantes de la tierra, en el medio del video me detuve a recordar algo simple: no somos solo emoción ni solo obediencia. Somos cuerpo, alma y espíritu, y el alma está aprendiendo a amar desde una fuente que no es la propia.\n\nSeguí el hilo completo en mi canal.\n\nEl video completo, Café reflexión, está en mi canal de YouTube. Y hay escritos en elgransueno.org\n\n#ElGranSueñoDeDios #ElGranSueño #CristoEnNosotros #CristoMiVida #NuevaVida #Plenitud #EspírituSanto"}, {"id": "r20-el-pastor-que-se-cuestiono", "titulo": "El pastor que se cuestiono", "serie": "Terraza 20", "ts": "2026-10-25 22:08", "llega": "2026-11-12T15:00", "texto": "Un pastor que escuché hace poco, y una pregunta que le cambió la vida. Lo conté en el café como un regalo, justo antes de llegar a Natanael en el video completo.\n\nNo es una historia de crítica: es una historia de sinceridad. Y de lo que pasa cuando uno mira primero hacia adentro.\n\nEl video completo, Café reflexión, está en mi canal de YouTube. Y hay escritos en elgransueno.org\n\n#ElGranSueñoDeDios #ElGranSueño #CristoEnNosotros #CristoMiVida #Luz #Libertad #Coherencia"}, {"id": "r21-todo-lo-que-viviste-tiene-sentido", "titulo": "Todo lo que viviste tiene sentido", "serie": "Terraza 21", "ts": "2026-10-25 22:08", "llega": "2026-11-12T19:00", "texto": "Después de hablar del alma y de la conciencia, y antes de llegar a la cruz, me paré a explicar por qué hablo así: porque lo recibí.\n\nSi hoy no entendés nada de lo que te pasó, este tramo es para vos. Hay más en el video completo, donde la perseverancia se junta con la verdad que hace libres.\n\nEl video completo, Café reflexión, está en mi canal de YouTube. Y hay escritos en elgransueno.org\n\n#ElGranSueñoDeDios #ElGranSueño #CristoEnNosotros #CristoMiVida #Reposo #Plenitud #NuevaVida"}, {"id": "r22-tu-esencia-es-cristo", "titulo": "Tu esencia es cristo", "serie": "Terraza 22", "ts": "2026-10-25 22:09", "llega": "2026-11-13T11:00", "texto": "Colosenses 1:27, que aparece completo en el video largo. Lo dije con ruido de fondo, en un café de Italia, porque no quería esperar a tener silencio para decirlo.\n\nSi alguna vez te preguntaste quién sos de verdad cuando se cae todo lo demás, seguí con el video completo en mi canal.\n\nEl video completo, Café reflexión, está en mi canal de YouTube. Y hay escritos en elgransueno.org\n\n#ElGranSueñoDeDios #ElGranSueño #CristoEnNosotros #CristoMiVida #Identidad #NuevaVida #Plenitud"}, {"id": "r23-no-se-trata-de-cerrar-la-puerta", "titulo": "No se trata de cerrar la puerta", "serie": "Terraza 23", "ts": "2026-10-25 22:09", "llega": "2026-11-13T15:00", "texto": "Lo dije hacia el final del video, justo antes de contar lo que viví esa semana. No critico la práctica: me pregunto qué buscamos cuando la hacemos.\n\nEl pasaje de entrar al cuarto y cerrar la puerta tiene una profundidad que se nos pasa cuando lo tomamos solo como método. El video completo está en mi canal.\n\nEl video completo, Café reflexión, está en mi canal de YouTube. Y hay escritos en elgransueno.org\n\n#ElGranSueñoDeDios #ElGranSueño #CristoEnNosotros #CristoMiVida #Reposo #Luz #EspírituSanto"}];
const CLAVE = "tiktok-pegados";
let pegados = {};
try { pegados = JSON.parse(localStorage.getItem(CLAVE) || "{}") || {}; } catch (e) { pegados = {}; }
let vista = "pend";
function guardar() { try { localStorage.setItem(CLAVE, JSON.stringify(pegados)); } catch (e) {} }
function fecha(ts) {
  const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(ts || ""); return m ? m[3] + "/" + m[2] : "";
}
async function copiar(texto, boton, pre) {
  try { await navigator.clipboard.writeText(texto); boton.textContent = "Copiado"; boton.classList.add("listo"); }
  catch (e) {
    pre.classList.add("abierto");
    const r = document.createRange(); r.selectNodeContents(pre);
    const s = getSelection(); s.removeAllRanges(); s.addRange(r);
    boton.textContent = "Seleccionado, copialo";
  }
  setTimeout(() => { boton.textContent = "Copiar texto"; boton.classList.remove("listo"); }, 2200);
}
function pintar() {
  const lista = document.getElementById("lista");
  lista.textContent = "";
  const pend = DATOS.filter(d => !pegados[d.id]), peg = DATOS.filter(d => pegados[d.id]);
  document.getElementById("n-pend").textContent = "(" + pend.length + ")";
  document.getElementById("n-peg").textContent = "(" + peg.length + ")";
  document.getElementById("tab-pend").setAttribute("aria-pressed", vista === "pend");
  document.getElementById("tab-peg").setAttribute("aria-pressed", vista === "peg");
  // con búsqueda se busca en todo (pendientes y pegados), así aparece aunque ya lo hayas marcado
  const palabras = limpio(document.getElementById("q").value).split(" ").filter(Boolean);
  document.getElementById("limpiar").hidden = !palabras.length;
  // primero los que coinciden en el título; después los que solo lo tienen en el texto
  const ver = palabras.length
    ? DATOS.filter(d => palabras.every(p => d._busca.includes(p)))
        .sort((a, b) => palabras.every(p => b._tit.includes(p)) - palabras.every(p => a._tit.includes(p)))
    : (vista === "pend" ? pend : peg);
  if (palabras.length) {
    const a = document.createElement("p"); a.className = "aviso";
    a.textContent = ver.length === 1 ? "1 texto encontrado" : ver.length + " textos encontrados";
    lista.appendChild(a);
  }
  if (!ver.length) {
    const p = document.createElement("p"); p.className = "vacio";
    p.textContent = palabras.length ? "No encontré ese video. Probá con otra palabra del título o del texto."
      : vista === "pend" ? "No queda ningún texto por pegar." : "Todavía no marcaste ninguno como pegado.";
    lista.appendChild(p); return;
  }
  for (const d of ver) {
    const f = document.createElement("article"); f.className = "ficha" + (pegados[d.id] ? " pegado" : "");
    const cab = document.createElement("div"); cab.className = "cab";
    const se = document.createElement("span"); se.className = "serie"; se.textContent = d.serie;
    const fe = document.createElement("span"); fe.className = "fecha" + (d.llega ? " llega" : "");
    fe.textContent = !d.llega ? "en el inbox" : d.llega === "en cola" ? "en cola, todavía no llegó" : "llega al inbox el " + fecha(d.llega);
    cab.append(se, fe);
    const t = document.createElement("h2"); t.className = "tit"; t.textContent = d.titulo;
    const pre = document.createElement("p"); pre.className = "texto"; pre.textContent = d.texto;
    const ac = document.createElement("div"); ac.className = "acciones";
    const bc = document.createElement("button"); bc.className = "btn copiar"; bc.textContent = "Copiar texto";
    bc.addEventListener("click", () => copiar(d.texto, bc, pre));
    const bv = document.createElement("button"); bv.className = "btn sec"; bv.textContent = "Ver todo";
    bv.addEventListener("click", () => { pre.classList.toggle("abierto"); bv.textContent = pre.classList.contains("abierto") ? "Achicar" : "Ver todo"; });
    const bm = document.createElement("button"); bm.className = "btn sec marcar";
    bm.setAttribute("aria-pressed", !!pegados[d.id]); bm.textContent = pegados[d.id] ? "Pegado" : "Ya lo pegué";
    bm.addEventListener("click", () => { if (pegados[d.id]) delete pegados[d.id]; else pegados[d.id] = 1; guardar(); pintar(); });
    ac.append(bc, bv, bm);
    f.append(cab, t, pre, ac);
    lista.appendChild(f);
  }
}
// sin tildes, sin mayúsculas, sin signos: "Qué" encuentra "que"; cada palabra puede ser un pedazo ("guer" encuentra "guerra")
function limpio(s) {
  return (s || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase()
    .replace(/[^a-z0-9ñ]+/g, " ").trim();
}
for (const d of DATOS) {
  d._tit = " " + limpio(d.titulo + " " + d.id) + " ";
  d._busca = " " + limpio([d.titulo, d.serie, d.id, d.texto].join(" ")) + " ";
}
document.getElementById("tab-pend").addEventListener("click", () => { vista = "pend"; pintar(); });
document.getElementById("tab-peg").addEventListener("click", () => { vista = "peg"; pintar(); });
document.getElementById("q").addEventListener("input", pintar);
document.getElementById("limpiar").addEventListener("click", () => {
  const q = document.getElementById("q"); q.value = ""; pintar(); q.focus();
});
pintar();
</script>
</html>
